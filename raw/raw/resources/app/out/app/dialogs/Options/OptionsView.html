<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./Options.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div id="message" class="row" data-bind="text: message"></div>

            <!-- ko if: hasLearnMoreLink  -->
            <a id="learn-more" href="#" data-bind="text: learnMoreLinkName, click: openLearnMore"></a>
            <!-- /ko-->

            <div class="option-select" data-bind="foreach: options">
                <div class="option">
                    <input type="radio" name="optionGroup" data-bind="attr: { id: id }, checkedValue: value, checked: $parent.selectedOption" />
                    <label data-bind="attr: { for: id }">
                        <span data-bind="text: title"> </span>
                    </label>
                </div>
            </div>
            <div class="option-description">
                <span role="alert" data-bind="attr: { class: descriptionClass }, text: descriptionText, visible: showDescription"></span>
            </div>

            <!-- ko if: hasCheckbox  -->
            <div class="checkbox-and-label">
                <input type="checkbox" data-bind="checked: checkboxChecked" id="checkbox-input">
                <label for="checkbox-input" data-bind="text: checkboxDisplayName"></label>
            </div>
            <!-- /ko-->
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
