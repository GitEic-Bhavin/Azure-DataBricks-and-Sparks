<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./Properties.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="key-value-lists-box">
                <!-- ko foreach: lists -->
                <!-- ko template: { if: type === "System", name: 'systemKeyValueList', data: $data } -->
                <!-- /ko -->
                <!-- ko template: { if: type === "User", name: 'userdataKeyValueList', data: $data } -->
                <!-- /ko -->
                <!-- /ko -->
            </div>
            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/html" id="systemKeyValueList">
        <div class="system-key-value-list-box">
            <div class="property-set-label" data-bind="text: name"></div>
            <div class="scroll-box">
                <div class="property-table">
                    <!-- ko foreach: data -->
                        <label data-bind="
                            text: displayName,
                            attr: { for: displayName() + '-value' },
                            css: { 'invalid-border': !!keyError() }
                        "></label>
                        <input type="text" data-bind="
                            textInput: displayValue,
                            css: { 'invalid-border': !!valueError() },
                            attr: { readonly: readOnly ? 'readonly' : undefined, id: displayName() + '-value' }
                        "/>
                    <!-- /ko -->
                </div>
            </div>
        </div>
    </script>

    <script type="text/html" id="userdataKeyValueList">
        <div class="userdata-key-value-list-box">
            <div class="property-set-label" data-bind="text: name"></div>
            <div class="scroll-box">
                <div class="userdata-table">
                    <!-- ko foreach: data -->
                    <input class="userdata-name"  type="text" data-bind="
                        textInput: displayName,
                        attr: {
                            readonly: readOnly ? 'readonly' : undefined,
                            'aria-label': $parent.name + ' key' + (!!keyError() ? ', invalid, ' + keyError().error : '')
                        },
                        css: { 'invalid-border': !!keyError() },
                        hasFocus: isFocused
                    "/>
                    <input class="userdata-value" type="text" data-bind="
                        textInput: displayValue,
                        css: { 'invalid-border': !!valueError() },
                        attr: {
                            readonly: readOnly ? 'readonly' : undefined,
                            'aria-label': $parent.name + ' value' + (!!valueError() ? ', invalid, ' + valueError().error : '')
                        },
                    "/>
                    <!-- ko ifnot: readOnly -->
                    <button data-bind="
                        click: $parent.remove.bind($parent, $index()),
                        attr: { 'aria-label': `remove ${displayName()} from ${$parent.name}` }
                    ">
                        <se-icon params="with: { name: 'Cancel' }"></se-icon>
                    </button>
                    <!-- /ko -->
                    <!-- /ko -->
                </div>
            </div>
            <!-- ko if: showAddButton -->
                <div class="table-buttons">
                    <input type="button" class="add-button" data-bind="
                        value: addLabel,
                        click: add,
                        enable: canAddNewEntry,
                        attr: {'aria-label': addLabel }
                    " />
                </div>
            <!-- /ko -->
        </div>
    </script>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
