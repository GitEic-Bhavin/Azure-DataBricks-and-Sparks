<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./Telemetry.css" data-plugin-theme="true" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <p data-bind="text: telemetryCollectionPurpose"></p>
            <p data-bind="text: telemetryAndPerformance"></p>
            <p data-bind="text: telemetryCollection"></p>
            <ul>
                <li data-bind="text: telemetryCollection1"></li>
                <li data-bind="text: telemetryCollection2"></li>
            </ul>
            <p data-bind="text: telemetryOptions"></p>
            <div class="row option-select">
                <div class="option">
                    <input type="radio" value="yes" id="sendTelemetry" name="telemetryOption" data-bind="checked: selectedTelemetryOption" />
                    <label for="sendTelemetry" data-bind="text: sendTelemetryOption"></label>
                </div>
                <div class="option">
                    <input type="radio" value="no" id="dontSendTelemetry" name="telemetryOption" data-bind="checked: selectedTelemetryOption" />
                    <label for="dontSendTelemetry" data-bind="text: optOutTelemetryOption"></label>
                </div>
            </div>
            <a href="#" data-bind="click: openPrivacyStatement, text: linkPrivacyStatement, attr: { 'aria-label': linkPrivacyStatement }"></a>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
