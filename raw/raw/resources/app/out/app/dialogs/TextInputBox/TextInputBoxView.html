<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./TextInputBox.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="main-container">
                <div class="message-and-icon-container">
                    <!-- ko if: !!icon -->
                    <div class="message-icon">
                        <se-icon params="with: { name: icon }"></se-icon>
                    </div>
                    <!-- /ko -->
                    <div class="message-text" id="main-text" data-bind="text: mainText"></div>
                </div>
                <div class="text-input-container">
                    <label for="text-input" data-bind="text: textInputLabel"></label>
                    <input class="text-input" type="text" id="text-input" aria-describedby="main-text" data-bind="
                        textInput: inputValue,
                        attr: { 'placeholder': placeholderText },
                        css: { 'invalid-field': !!errorMessage() },
                        onEnterKey: submit,
                        selectedText: selectedInputText" />
                </div>
                <se-alert params="with: errorAlertViewModel"></se-alert>

                <!-- ko if: isValidating -->
                <div id="validation-alert" class="alert" role="alert" aria-atomic="true" aria-live="polite"
                    data-bind="attr: { 'aria-label': validationAlertMessage }">
                    <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                    <div data-bind="text: validationAlertMessage"></div>
                </div>
                <!-- /ko -->
            </div>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
