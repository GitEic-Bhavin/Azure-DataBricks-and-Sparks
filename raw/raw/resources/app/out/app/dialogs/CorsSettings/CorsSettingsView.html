<!DOCTYPE html>
<html class="page" lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./CorsSettings.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: defaultPanel">
            <div class="cors-container">
                <div class="cors-rule-list" role="listbox" aria-describedby="cors-instruction-label" data-bind="attr: { 'aria-label': ruleLabel }">
                    <!-- ko foreach: corsRuleList -->
                    <div role="option" data-bind="
                        text: displayName,
                        click: $parent.handleClick,
                        hasFocus: hasFocus,
                        attr: { title: allowedOriginsText, tabindex: isSelected() ? '0' : '-1' },
                        css: { 'selected': isSelected },
                        event: { keydown: (v, e) => $parent.onKeyDown(v, e) }">
                    </div>
                    <!-- /ko -->
                </div>

                <div class="list-buttons">
                    <input type="button" data-bind="value: addLabel, click: openEditRulePanelForAdd, enable: canAdd, hasFocus: isAddButtonFocused" />
                    <input type="button" data-bind="value: editLabel, click: openEditRulePanelForEdit, enable: canEdit, hasFocus: isEditButtonFocused" />
                    <input type="button" data-bind="value: deleteLabel, click: deleteSelectedRule, enable: canDelete" />
                </div>
            </div>

            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'editor-panel', with: editPanel">
            <div class="row">
                <label for="allowedOriginsLabel" data-bind="text: allowedOriginsLabel"></label>
                <input id="allowedOriginsLabel" type="text" data-bind="textInput: allowedOriginsValue">
            </div>

            <div class="row">
                <label for="allowedMethodsLabel" data-bind="text: allowedMethodsLabel"></label>
                <input id="allowedMethodsLabel" type="text" data-bind="textInput: allowedMethodsValue">
            </div>

            <div class="row">
                <label for="allowedHeadersLabel" data-bind="text: allowedHeadersLabel"></label>
                <input id="allowedHeadersLabel" type="text" data-bind="textInput: allowedHeadersValue">
            </div>

            <div class="row">
                <label for="exposedHeadersLabel" data-bind="text: exposedHeadersLabel"></label>
                <input id="exposedHeadersLabel" type="text" data-bind="textInput: exposedHeadersValue">
            </div>

            <div class="row">
                <label for="maxAgeInSecondsLabel" data-bind="text: maxAgeInSecondsLabel"></label>
                <input id="maxAgeInSecondsLabel" type="number" min="0" data-bind="value: maxAgeInSecondsDisplayValue" style="width: 150px;">
            </div>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
