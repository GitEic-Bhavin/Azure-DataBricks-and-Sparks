<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./UndeleteByDateRange.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="description">
                <label data-bind="text: mainText"></label>
            </div>
            <div class="grid-container">
                <div class="grid-item">
                    <label id="start-date" data-bind="text: startDateLabel"></label>
                </div>
                <div class="grid-item">
                    <label id="end-date" data-bind="text: endDateLabel"></label>
                </div>
                <div class="grid-item">
                    <input class="invalid-field" type="datetime-local" data-bind="value: displayStartTimestamp, css: { 'invalid-field': isInvalidStartTimestamp() || isStartInputAfterEndInput() }"
                        aria-labelledby="start-date">
                </div>
                <div class="grid-item">
                    <input class="invalid-field" type="datetime-local" data-bind="value: displayEndTimestamp, css: { 'invalid-field': isInvalidEndTimestamp() || isStartInputAfterEndInput() }"
                        aria-labelledby="end-date">
                </div>
            </div>
            <div class="row">
                <div>
                    <label id="time-zone-label" data-bind="text: timeZoneLabel"></label>
                </div>
                <div>
                    <input id="use-local-time-field" type="radio" name="timeZone" value="local" aria-describedby="time-zone-label" data-bind="checked: timeZone">
                    <label for="use-local-time-field" class="radio-text" data-bind="text: useLocalOption"></label>
                </div>
                <div>
                    <input id="use-UTC-field" type="radio" name="timeZone" value="utc" data-bind="checked: timeZone">
                    <label for="use-UTC-field" class="radio-text" data-bind="text: useUTCOption"></label>
                </div>
            </div>
            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
