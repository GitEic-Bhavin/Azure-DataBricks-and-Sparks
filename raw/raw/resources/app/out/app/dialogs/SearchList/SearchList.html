<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./SearchList.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="input-group">
                <label for="search-input" class="col-all" data-bind="text: searchInputLabel"></label>
                <input id="search-input" class="col-1-2" data-bind="
                    event: { keydown: (data, event) => onSearchInputKeyDown(event) },
                    textInput: searchInput,
                    attr: { 'placeholder': searchInputPlaceholder },
                    hasFocus: isSearchInputFocused"/>
                <button class="icon-button col-3" data-bind="
                    click: search,
                    attr: { disabled: isSearching, 'aria-label': searchButtonLabel }">
                    <div class="icon-button-content">
                        <div class="icon-button-icon" data-bind="click: search, enable: !isSearching()">
                            <se-icon params="with: { name: 'Search' }"></se-icon>
                        </div>
                        <div class="icon-button-label" data-bind="text: searchButtonLabel"></div>
                    </div>
                </button>
            </div>

            <div class="input-group vertical-fill">
                <div role="listbox" id="search-result-list" class="list-box col-all" data-bind="attr: { 'aria-label': searchResultsLabel }">
                    <!-- ko foreach: searchResults -->
                    <div role="option" class="list-box-item" data-bind="
                        css: { 'selected': $parent.selectedSearchResult() === $data },
                        attr: {
                            'tabindex': $parent.selectedSearchResult() === $data ? '0': '-1',
                            'aria-selected': $parent.selectedSearchResult() === $data
                        },
                        event: { keydown: (data, event) => $parent.onSearchResultKeyDown(data, event) },
                        hasFocus: isFocused,
                        click: (data, event) => { $parent.select(data); },
                        clickBubble: false
                    ">
                        <div class="list-box-item-content">
                            <!-- ko if: isProgressItem -->
                            <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                            <!-- /ko -->
                            <div class="list-box-item-label" data-bind="text: label"></div>
                        </div>

                    </div>
                    <!-- /ko -->
                </div>
            </div>
            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
