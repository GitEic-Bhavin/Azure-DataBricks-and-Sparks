<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />
</head>

<body>
    <script type="text/javascript">
        const dialogId = window.location.hash.substring(1);
        const dialogDirUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/"));

        let newHref = window.location.href;
        switch (dialogId) {
            case "appReset":
                newHref = `${dialogDirUrl}/AppReset/AppResetView.html#${dialogId}`;
                break;
            case "azureAdDeepLink":
                newHref = `${dialogDirUrl}/AzureAdDeepLink/AzureAdDeepLinkView.html#${dialogId}`;
                break;
            case "connectDialog":
                newHref = `${dialogDirUrl}/Connect2/ConnectView.html#${dialogId}`;
                break;
            case "corsSettings":
                newHref = `${dialogDirUrl}/CorsSettingsReact/index.html#${dialogId}`;
                break;
            case "customizeColumns":
                newHref = `${dialogDirUrl}/CustomizeColumns/CustomizeColumnsView.html#${dialogId}`;
                break;
            case "customizeColumnsReact":
                newHref = `${dialogDirUrl}/CustomizeColumnsReact/index.html#${dialogId}`;
                break;
            case "customizeTimestamp":
                newHref = `${dialogDirUrl}/CustomizeTimestamp/CustomizeTimestampView.html#${dialogId}`;
                break;
            case "customMessageBox":
                newHref = `${dialogDirUrl}/CustomMessageBoxReact/index.html#${dialogId}`;
                break;
            case "deleteRetentionPolicy":
                newHref = `${dialogDirUrl}/DeleteRetentionPolicy/ConfigureDeleteRetentionPolicyView.html#${dialogId}`;
                break;
            case "errorDetails":
                newHref = `${dialogDirUrl}/ErrorDetails/ErrorDetailsView.html#${dialogId}`;
                break;
            case "eula":
                newHref = `${dialogDirUrl}/Eula/EulaView.html#${dialogId}`;
                break;
            case "generateAccountSas":
            case "generateBlobSas":
            case "generateHnsBlobSas":
            case "generateFileSas":
            case "generateQueueSas":
            case "generateTableSas":
                newHref = `${dialogDirUrl}/GenerateSas/GenerateSasView.html#${dialogId}`;
                break;
            case "manageBlobAcl":
            case "manageFileAcl":
            case "manageQueueAcl":
            case "manageTableAcl":
                newHref = `${dialogDirUrl}/ManageAclReact/index.html#${dialogId}`;
                break;
            case "multiOption":
                newHref = `${dialogDirUrl}/MultiOption/MultiOptionView.html#${dialogId}`;
                break;
            case "nps":
                newHref = `${dialogDirUrl}/NPS/NpsView.html#${dialogId}`;
                break;
            case "options":
                newHref = `${dialogDirUrl}/OptionsReact/index.html#${dialogId}`;
                break;
            case "properties":
                newHref = `${dialogDirUrl}/Properties/PropertiesView.html#${dialogId}`;
                break;
            case "proxySettings":
                newHref = `${dialogDirUrl}/ProxySettings/ProxySettingsView.html#${dialogId}`;
                break;
            case "sasDeepLink":
                newHref = `${dialogDirUrl}/SasDeepLinkReact/index.html#${dialogId}`;
                break;
            case "searchList":
                newHref = `${dialogDirUrl}/SearchList/SearchList.html#${dialogId}`;
                break;
            case "sendFeedback":
                newHref = `${dialogDirUrl}/SendFeedback/SendFeedbackDialog.html#${dialogId}`;
                break;
            case "telemetry":
                newHref = `${dialogDirUrl}/Telemetry/TelemetryView.html#${dialogId}`;
                break;
            case "textInputMessageBox":
                newHref = `${dialogDirUrl}/TextInputBox/TextInputBoxView.html#${dialogId}`;
                break;
            case "undeleteByDateRange":
                newHref = `${dialogDirUrl}/UndeleteByDateRange/UndeleteByDateRangeView.html#${dialogId}`;
                break;
            default:
                console.warn("Unregistered dialogId: ", dialogId);
                break;
        }
        window.location.href = newHref;
    </script>
</body>
