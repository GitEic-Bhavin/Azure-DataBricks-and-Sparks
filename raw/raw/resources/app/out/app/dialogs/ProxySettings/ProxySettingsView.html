<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./ProxySettings.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: proxySettingsViewModel">
            <div class="input-group">
                <label for="source" class="col-all label" data-bind="text: sourceLabel"></label>
                <select id="source" class="col-1 to-4 input" data-bind="options: proxySourceOptions, optionsText: 'optionText', optionsValue: 'optionValue', value: selectedProxySource"></select>

                <label for="url" class="col-all label" data-bind="text: urlLabel"></label>
                <input id="url" class="col-1 to-6 input" type="text" data-bind="textInput: displayUrl, enable: isCustomProxyEnabled, css: { 'invalid-field': !isUrlValid() }" />

                <label for="port" class="col-all label" data-bind="text: portLabel"></label>
                <input id="port" class="col-1 to-3 input" type="text"data-bind="textInput: displayPort, enable: isCustomProxyEnabled, css: { 'invalid-field': !isPortValid() }" />

                <label for="bypass" class="col-all label" data-bind="text: noProxyLabel"></label>
                <textarea id="bypass" class="col-all input" rows="5" data-bind="
                    textInput: displayNoProxy,
                    enable: isCustomProxyEnabled,
                    css: { 'invalid-field': !isNoProxyValid() },
                    attr: { placeholder: noProxyPlaceholder }">
                </textarea>

                <div class="col-all input-group">
                    <input id="useCredentials" class="col-1 to-2 checkbox" type="checkbox" data-bind="checked: isCredentialsChecked, enable: isCustomProxyEnabled() || isSystemProxyEnabled()" />
                    <label for="useCredentials" class="col-2 to-6 label" data-bind="text: useCredentialsLabel"></label>

                    <div class="col-2 to-6 input-group">
                        <label for="userName" class="col-all label" data-bind="text: usernameLabel"></label>
                        <input id="userName" class="col-1 to-4 input" type="text" data-bind="value: username, enable: isCredentialsEnabled, css: { 'invalid-field': !isUsernameValid() }" />

                        <label for="password" class="col-all label" data-bind="text: passwordLabel"></label>
                        <input id="password" class="col-1 to-4 input" type="password" data-bind="value: password, enable: isCredentialsEnabled" />
                    </div>
                </div>
            </div>
            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
