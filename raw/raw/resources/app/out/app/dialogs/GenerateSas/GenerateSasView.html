<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./GenerateSas.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: generateSasPanel">
            <div class="input-group">
                <label class="col-1" for="signing-key" data-bind="text: keySelectLabel"></label>
                <select class="col-2 to-end" id="signing-key" data-bind="
                    options: keyOptions,
                    value: selectedKey,
                    optionsText: 'displayName',
                    enable: hasMoreThanOneKeyOption"
                >
                </select>
                <!-- ko if: resourceType !== "account" && selectedKey().value === "AccountKey" -->
                <label class="col-1" for="policy" data-bind="text: policyLabel"></label>
                <select class="col-2 to-end" id="policy" data-bind="
                    options: accessPolicies,
                    optionsText: (item) => item.Id || noSapLabel,
                    value: selectedAccessPolicy"
                >
                </select>
                <!-- /ko -->

                <label class="col-1" for="start-time" data-bind="text: startTimestampLabel"></label>
                <input class="col-2 to-5" type="datetime-local" id="start-time" data-bind="
                    value: displayStartTimestamp,
                    enable: isStartTimestampEnabled,
                    css: { 'invalid-field': isInvalidStartTimestamp },
                    attr: { title: startTimestampTooltip }"
                />

                <label class="col-1" for="expire-time" data-bind="text: expiryTimestampLabel"></label>
                <input class="col-2 to-5" type="datetime-local" id="expire-time" data-bind="
                    value: displayExpiryTimestamp,
                    enable: isExpiryTimestampEnabled,
                    css: { 'invalid-field': isInvalidExpiryTimestamp },
                    attr: { title: expiryTimestampTooltip }"
                />

                <label id="timezone-label" class="col-1" data-bind="text: timeZoneLabel"></label>
                <div class="col-2 to-end radio-group">
                    <input id="local" type="radio" name="timezone" value="local" aria-describedby="timezone-label" data-bind="checked: timeZone" />
                    <label for="local" data-bind="text: localTimeLabel"></label>
                    <input id="utc" class="col-3" type="radio" name="timezone" value="utc" aria-describedby="timezone-label" data-bind="checked: timeZone">
                    <label for="utc" class="col-4" data-bind="text: utcLabel"></label>
                </div>
            </div>

            <fieldset>
                <legend id="permissions-label" data-bind="text: permissionsLabel"></legend>
                <div class="check-group group-box" data-bind="css: { 'invalid-field': isInvalidPermissions }, attr: { title: permissionsTooltip }">
                    <!-- ko foreach: permissionViewModels -->
                    <input type="checkbox" aria-describedby="permissions-label" data-bind="
                        attr: { 'id': label + '-permission' },
                        value: value,
                        checked: isSelected,
                        enable: $parent.isPermissionsEnabled"
                    />
                    <label data-bind="text: label, attr: { 'for': label + '-permission' }"></label>
                    <!-- /ko -->
                </div>
            </fieldset>

            <!-- ko if: resourceType === "account" -->
            <fieldset>
                <legend id="supported-services-label" data-bind="text: supportedServicesLabel"></legend>
                <div class="check-group group-box">
                    <!-- ko foreach: supportedServices -->
                    <input class="col-1" type="checkbox" aria-describedby="supported-services-label" data-bind="
                        attr: { 'id': label + '-service-type' },
                        value: value,
                        checked: isSelected,
                        disable: isDisabled"
                    />
                    <label class="col-2 to-end" data-bind="text: label, attr: { 'for': label + '-service-type' }"></label>
                    <!-- /ko -->
                </div>
            </fieldset>

            <fieldset>
                <legend id="supported-types-label" data-bind="text: supportedTypesLabel"></legend>
                <div class="check-group group-box">
                    <!-- ko foreach: supportedTypes -->
                    <input class="col-1" type="checkbox" aria-describedby="supported-types-label" data-bind="
                        attr: { 'id': label + '-resource-type' },
                        value: value, checked: isSelected"
                    />
                    <label class="col-2 to-end" data-bind="text: label, attr: { 'for': label + '-permission' }"></label>
                    <!-- /ko -->
                </div>
            </fieldset>
            <!-- /ko -->

            <fieldset>
                <legend id="additiona-options-label" data-bind="text: additionalOptionsLabel"></legend>
                <div class="input-group group-box">
                    <!-- ko if: resourceType === "table" -->
                    <label for="start-pk" class="col-1" data-bind="text: startPartitionKeyLabel"></label>
                    <input id="start-pk" class="col-2 to-end" data-bind="
                        textInput: startPartitionKey,
                        css: { 'invalid-field': !isStartPartitionKeyValid() }"
                    />

                    <label for="start-rk" class="col-1" data-bind="text: startRowKeyLabel"></label>
                    <input id="start-rk" class="col-2 to-end" data-bind="
                        textInput: startRowKey,
                        css: { 'invalid-field': !isStartRowKeyValid() }"
                    />

                    <label for="end-pk" class="col-1" data-bind="text: endPartitionKeyLabel"></label>
                    <input id="end-pk" class="col-2 to-end" data-bind="
                        textInput: endPartitionKey,
                        css: { 'invalid-field': !isEndPartitionKeyValid() }"
                    />

                    <label for="end-rk" class="col-1" data-bind="text: endRowKeyLabel"></label>
                    <input id="end-rk" class="col-2 to-end" data-bind="
                        textInput: endRowKey,
                        css: { 'invalid-field': !isEndRowKeyValid() }"
                    />
                    <!-- /ko -->

                    <label for="ip-range" class="col-1" data-bind="text: ipRangeLabel"></label>
                    <input id="ip-range" class="col-2 to-end" data-bind="
                        textInput: ipRange.value,
                        attr: { placeholder: ipRangePlaceholder },
                        css: { 'invalid-field': !ipRange.isValid() }"
                    />

                    <label for="signed-version" class="col-1" data-bind="text: versionLabel"></label>
                    <input id="signed-version" class="col-2 to-end" data-bind="
                        textInput: version.value,
                        attr: { placeholder: versionPlaceholder },
                        css: { 'invalid-field': !version.isValid() }"
                    />

                    <label for="api-version" class="col-1" data-bind="text: apiVersionLabel"></label>
                    <input id="api-version" class="col-2 to-end" data-bind="
                        textInput: apiVersion.value,
                        attr: { placeholder: versionPlaceholder },
                        css: { 'invalid-field': !apiVersion.isValid() }"
                    />

                    <!-- ko if: resourceType === "blob" || resourceType === "hns" || resourceType === "file" -->
                    <label for="encryption-scope" class="col-1" data-bind="text: encryptionScopeLabel"></label>
                    <input id="encryption-scope" class="col-2 to-end" data-bind="textInput: encryptionScope" />

                    <label for="cache-control" class="col-1" data-bind="text: cacheControlLabel"></label>
                    <input id="cache-control" class="col-2 to-end" data-bind="textInput: cacheControl" />

                    <label for="content-disposition" class="col-1" data-bind="text: contentDispositionLabel"></label>
                    <input id="content-disposition" class="col-2 to-end" data-bind="textInput: contentDisposition" />

                    <label for="content-encoding" class="col-1" data-bind="text: contentEncodingLabel"></label>
                    <input id="content-encoding" class="col-2 to-end" data-bind="textInput: contentEncoding" />

                    <label for="content-language" class="col-1" data-bind="text: contentLanguageLabel"></label>
                    <input id="content-language" class="col-2 to-end" data-bind="textInput: contentLanguage" />

                    <label for="content-type" class="col-1" data-bind="text: contentTypeLabel"></label>
                    <input id="content-type" class="col-2 to-end" data-bind="textInput: contentType" />
                    <!-- /ko -->
                </div>
            </fieldset>

            <div class="input-group">
                <input id="allow-http" class="col-1" type="checkbox" data-bind="checked: allowHttp" />
                <label for="allow-http" class="col-2 to-end" data-bind="text: allowHttpLabel"></label>
            </div>

            <se-alert params="with: alertViewModel"></se-alert>

            <!-- ko if: (resourceType === "blob" || resourceType === "hns") && isSasForBlob -->
            <se-alert params="with: containerLevelAlertViewModel"></se-alert>
            <!-- /ko -->
            <!-- ko if: resourceType === "file" && isSasForFile -->
            <se-alert params="with: containerLevelAlertViewModel"></se-alert>
            <!-- /ko -->

            <div class="content-spacer"></div>

            <div class="input-group">
                <a id="learn-more" class="col-all" href="#" data-bind="click: openLearnMore, text: learnMoreText"></a>
            </div>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'show-panel', with: showSasPanel">
            <div class="input-group">
                <label for="container-name-input" class="col-all" data-bind="text: itemType"></label>
                <input id="container-name-input" class="col-all" type="text" readonly data-bind="value: itemName" />
            </div>

            <div class="text-copy-group">
                <label for="url-input" data-bind="text: connectionLabel"></label>
                <textarea id="url-input" rows="5" readonly data-bind="value: sasConnection"></textarea>
                <button for="sasUrl" class="copy-button" data-bind="
                    text: copyButtonLabel,
                    click: copyConnectionToClipboard,
                    attr: { title: copyConnectionButtonDescription, 'aria-label': copyConnectionButtonDescription }
                ">
                </button>
            </div>

            <div class="text-copy-group">
                <label for="query-string-input" data-bind="text: sasQueryStringLabel"></label>
                <textarea id="query-string-input" rows="5" readonly data-bind="value: sasToken"></textarea>
                <button for="sasToken" class="copy-button" data-bind="
                    text: copyButtonLabel,
                    click: copyTokenToClipboard,
                    attr: { title: copyTokenButtonDescription, 'aria-label': copyTokenButtonDescription }
                ">
                </button>
            </div>

            <se-alert class="error-details" params="with: alertViewModel"></se-alert>

            <!-- Invisible element that we use to send out aria alerts regarding the state of the text copy -->
            <div aria-live="assertive" role="alert" data-bind="attr:{ 'aria-label': ariaAlert }"></div>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
