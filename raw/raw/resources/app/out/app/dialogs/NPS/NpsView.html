<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./Nps.css" data-plugin-theme="true" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <p>
                <!-- The comments here are needed to eliminate unwanted spaces between inline elements. -->
                <span data-bind="text: linkInviteHeadText"></span><!--
                --><a data-bind="text: linkCaption, attr: { href: linkUrl, title: linkTooltip }, click: onLink"></a><!--
                --><span data-bind="text: linkInviteTailText"></span>
            </p>

            <div id="nps-dialog-donotshow-check" class="dontShowOption">
                <input type="checkbox" id="nps-dialog-donotshow" data-bind="checked: doNotShow" />
                <label for="nps-dialog-donotshow" class="nps-dialog-checkbox checkbox-label" data-bind="text: doNotShowAgainText"></label>
            </div>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
