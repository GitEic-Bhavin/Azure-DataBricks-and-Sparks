<!DOCTYPE html>
<html class="page" lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./Connect.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panels['default-panel']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->

            <h2 data-bind="text: resourceSelectPrompt, attr: { 'aria-label': resourceSelectPrompt }"></h2>

            <div class="nav-button-group" data-bind="foreach: resourceNavButtons">
                <se-nav-button params="with: $data"></se-nav-button>
            </div>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'env-select', with: panels['env-select']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->

            <h2 data-bind="text: envSelectPrompt"></h2>

            <div class="input-group">
                <!-- ko foreach: environmentOptions-->
                <input class="col-1 checkbox" type="radio" name="azure-env-options" data-bind="
                    checked: $parent.selectedEnvironment,
                    checkedValue: value,
                    attr: { id: `${value}-env-option` }" />
                <label class="col-2 label" data-bind="text: label, attr: { for: `${value}-env-option` }"></label>
                <!-- /ko -->

                <select class="col-2 input" data-bind="
                    options: customEnvironmentOptions,
                    value: selectedCustomEnvironment,
                    enable: selectedEnvironment() === 'azurestack' && customEnvironmentOptions().length > 0">
                </select>
                <button class="link col-2 input right-align" data-bind="text: envManageLabel, click: manageEnvironments"></button>
            </div>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'sign-in', with: panels['sign-in']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->

            <div class="sign-in-group">
                <div class="sign-in-message" data-bind="text: message"></div>

                <!-- ko if: isDeviceCodeFlowButtonVisible -->
                <div class="device-code-flow-button">
                    <button data-bind="text: codeFlowButtonCaption, click: copyAndOpen"></button>
                </div>
                <!-- /ko -->

                <!-- ko if: isSpinnerVisible -->
                <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                <!-- /ko -->
            </div>
            <se-alert style="align-self: center;" params="with: deviceCodeFlowAlert"></se-alert>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'account-auth-select', with: panels['account-auth-select']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'auth-select' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'account-key-entry', with: panels['account-key-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->

            <div class="input-group">
                <label for="account-key-display-name" class="col-all label" data-bind="text: displayNameLabel"></label>
                <input id="account-key-display-name" class="col-all input" data-bind="
                    textInput: displayNameInput.value,
                    css: { 'invalid-field': !!displayNameInput.isModified() && !displayNameInput.isValid() }">

                <label for="account-key-account-name" class="col-all label" data-bind="text: accountNameLabel"></label>
                <input id="account-key-account-name" class="col-all input" required="true" data-bind="
                    textInput: accountName.value,
                    css: { 'invalid-field': !!accountName.isModified() && !accountName.isValid() }">

                <label for="account-key-account-key" class="col-all label" data-bind="text: accountKeyLabel"></label>
                <input id="account-key-account-key" class="col-all input" required="true" data-bind="
                    textInput: accountKey.value,
                    css: { 'invalid-field': !!accountKey.isModified() && !accountKey.isValid() }">

                <label class="col-all label" data-bind="text: domainOptionsLabel"></label>
                <div class="col-all input input-group" data-bind="foreach: domainOptions">
                    <input class="col-1 checkbox" type="radio" name="account-key-domain" data-bind="
                        checked: $parent.selectedDomain,
                        checkedValue: value,
                        attr: { id: `${value}-option` }" />
                    <label class="col-2 label" data-bind="text: label, attr: { for: `${value}-option` }"></label>
                    <!-- ko if: value === $parent.customDomainSelectionValue -->
                    <input class="col-2 input" data-bind="
                        textInput: $parent.customDomain.value,
                        enable: $parent.isCustomDomainSelected,
                        css: { 'invalid-field': $parent.isCustomDomainSelected() && $parent.customDomain.isModified() && !$parent.customDomain.isValid() },
                        attr: { 'aria-label': label }" />
                    <!-- /ko -->
                </div>

                <input class="col-1 checkbox" type="checkbox" data-bind="checked: useHttp ">
                <label class="col-2 label" data-bind="text: useHttpLabel"></label>
            </div>

            <se-alert params="with: validationAlert"></se-alert>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'account-sas-entry', with: panels['account-sas-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'account-conn-str-entry', with: panels['account-conn-str-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'blob-auth-select', with: panels['blob-auth-select']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'auth-select' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'blob-sign-in-entry', with: panels['blob-sign-in-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'blob-sas-entry', with: panels['blob-sas-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'blob-anon-entry', with: panels['blob-anon-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'adls2-auth-select', with: panels['adls2-auth-select']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'auth-select' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'adls2-sign-in-entry', with: panels['adls2-sign-in-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'adls2-sas-entry', with: panels['adls2-sas-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'adls2-anon-entry', with: panels['adls2-anon-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'queue-auth-select', with: panels['queue-auth-select']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'auth-select' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'queue-sign-in-entry', with: panels['queue-sign-in-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'queue-sas-entry', with: panels['queue-sas-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'file-auth-select', with: panels['file-auth-select']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'auth-select' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'file-sign-in-entry', with: panels['file-sign-in-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'file-sas-entry', with: panels['file-sas-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'table-auth-select', with: panels['table-auth-select']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'auth-select' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'table-sign-in-entry', with: panels['table-sign-in-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'table-sas-entry', with: panels['table-sas-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->
            <!-- ko template: { name: 'entry-panel' }--><!-- /ko -->
        </se-dialog-panel>

        <se-dialog-panel params="id: 'emulator-entry', with: panels['emulator-entry']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->

            <div class="input-group">
                <label for="emulator-entry-display-name" class="col-all label" data-bind="text: displayNameLabel"></label>
                <input id="emulator-entry-display-name" class="col-all input" type="text" data-bind="
                    textInput: displayNameInput.value,
                    css: { 'invalid-field': !!displayNameInput.isModified() && !displayNameInput.isValid() }" />

                <label for="dev-account-name" class="col-all label" data-bind="text: accountNameLabel"></label>
                <input id="dev-account-name" class="col-all input" data-bind="
                    textInput: accountName.value,
                    attr: { placeholder: defaultAccountName }"/>

                <label for="dev-account-key" class="col-all label" data-bind="text: accountKeyLabel"></label>
                <input id="dev-account-key" class="col-all input" data-bind="
                    textInput: accountKey.value,
                    attr: { placeholder: defaultAccountKey },
                    css: { 'invalid-field': !!accountKey.isModified() && !accountKey.isValid() }">

                <label for="blob-port" class="col-all label" data-bind="text: blobPortLabel"></label>
                <input id="blob-port" class="col-all input" type="number" min="0" max="65535" data-bind="
                    textInput: blobPort.value,
                    attr: { placeholder: portPlaceholder },
                    css: { 'invalid-field': !blobPort.isValid() }" />

                <label for="file-port" class="col-all label" data-bind="text: filePortLabel"></label>
                <input id="file-port" class="col-all input" type="number" min="0" max="65535" data-bind="
                    textInput: filePort.value,
                    attr: { placeholder: portPlaceholder },
                    css: { 'invalid-field': !filePort.isValid() }" />

                <label for="queue-port" class="col-all label" data-bind="text: queuePortLabel"></label>
                <input  id="queue-port" class="col-all input" type="number" min="0" max="65535" data-bind="
                    textInput: queuePort.value,
                    attr: { placeholder: portPlaceholder },
                    css: { 'invalid-field': !queuePort.isValid() }" />

                <label for="table-port" class="col-all label" data-bind="text: tablePortLabel"></label>
                <input id="table-port"  class="col-all input" type="number" min="0" max="65535"data-bind="
                    textInput: tablePort.value,
                    attr: { placeholder: portPlaceholder },
                    css: { 'invalid-field': !tablePort.isValid() }" />

                    <input id="emulator-entry-use-https" class="col-1 checkbox" type="checkbox" data-bind="checked: useHttps" />
                    <label for="emulator-entry-use-https" class="col-2 label" data-bind="text: useHttpsLabel"></label>
                </div>
            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'summary', with: panels['summary']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->

            <h2 data-bind="text: summaryLabel, attr: { 'aria-label': summaryLabel }"></h2>

            <div class="property-group" data-bind="foreach: values">
                <label class="property-label" data-bind="text: label, attr: { for: label }"></label>
                <div class="property-value" data-bind="text: value, attr: { id: label, title: value }"></div>
            </div>
            <se-alert params="with: securityStatusViewModel"></se-alert>
            <se-alert params="with: emulatorStatusViewModel"></se-alert>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'tenant-select', with: panels['tenant-select']">
            <!-- ko template: { name: 'orientation-bar' }--><!-- /ko -->

            <label for="azure-account-picker" class="account-label" data-bind="text: accountPickerLabel"></label>
            <div id="azure-account-picker" role="listbox" class="list account-list">
                <!-- ko foreach: accounts -->
                <div role="option" class="selectable-list-item" data-bind="
                    hasFocus: focused,
                    css: { 'selected': $parent.selectedAccount() === $data, 'account-list-option': !!icon(), 'account-list-option-no-icon': !icon() },
                    click: (data, event) => { $parent.selectAccount(data); },
                    attr: { tabIndex: $parent.selectedAccount() === $data ? '0': '-1' },
                    event: { keydown: (data, event) => $parent.onAccountKeyDown(data, event) }">
                    <img class="account-list-option-icon" data-bind="visible: !!icon(), attr: { src: icon }" />
                    <div>
                        <div data-bind="text: displayName"></div>
                        <div data-bind="text: email"></div>
                    </div>
                </div>
                <!-- /ko -->
            </div>

            <label for="tenant-dropdown" class="tenant-label" data-bind="text: tenantDropDownLabel"></label>
            <!-- We use valueAllowUnset so knockout doesn't try to set a value when the selected account/tenantOptions() changes. -->
            <!-- valueAllowUnset tells knockout that it is ok for something not in `options` to be the value of `value`.  -->
            <!-- If valueAllowUnset was not enabled, then after the selected account/tenantOptions() changes, knockout would  -->
            <!-- try to set a valid value. This interferes with us selecting the home tenant by default. -->
            <!-- That happens in TenantSelectViewModel (look for `preferredOption`) -->
            <select class="tenant-input" id="tenant-dropdown" data-bind="
                options: tenantOptions(),
                optionsText: 'displayName',
                value: selectedTenant,
                enable: enableTenantDropdown,
                optionsAfterRender: setOptionDisable,
                valueAllowUnset: true">
            </select>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'env-list', with: envListViewModel">
            <label for="env-list-environments-list" class="environment-list-label" data-bind="text: environmentListLabel"></label>
            <div id="env-list-environments-list" role="listbox" class="list environment-list col-all input">
                <!-- ko foreach: customEnvironments -->
                <div class="selectable-list-item" role="option" data-bind="
                    hasFocus: hasFocus,
                    css: { 'selected': $parent.selectedEnvironment() === $data },
                    click: (data, event) => { $parent.selectEnvironment(data); },
                    attr: {
                        'aria-labelledby': `environment-label-${$index()}`,
                        'aria-describedby': `environment-description-${$index()}`,
                        tabIndex: $parent.selectedEnvironment() === $data ? '0': '-1'
                    },
                    event: { keydown: (data, event) => $parent.onEnvironmentItemKeyDown(data, event) }">
                    <div class="selectable-list-item-label" data-bind="text: name, attr: { id: `environment-label-${$index()}` }"></div>
                    <div class="selectable-list-item-description" data-bind="text: armEndpoint, attr: { id: `environment-description-${$index()}` }"></div>
                    <div class="selectable-list-item-actions">
                        <!-- ko if: isMarkedForDeletion -->
                        <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                        <!-- /ko -->
                        <!-- ko ifnot: isMarkedForDeletion -->
                        <button class="list-item-button icon-button" data-bind="
                            click: (data, event) => $parent.deleteEnvironment(data),
                            attr: { 'aria-label': deleteButtonLabel }">
                            <div class="icon-button-content">
                                <div class="icon-button-icon">
                                    <se-icon params="with: { name: 'Delete' }"></se-icon>
                                </div>
                            </div>
                        </button>
                        <!-- /ko -->
                    </div>
                </div>
            <!-- /ko -->
            </div>
            <div class="environment-list-buttons">
                <button class="icon-button" data-bind="click: addEnvironment, hasFocus: addButtonHasFocus">
                    <div class="icon-button-content">
                        <div class="icon-button-icon">
                            <se-icon params="with: { name: 'Add' }"></se-icon>
                        </div>
                        <div class="icon-button-label" data-bind="text: addEnvironmentLabel"></div>
                    </div>
                </button>
            </div>

            <div class="alert" data-bind="visible: connectStatusPrompt">
                <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                <div data-bind="text: connectStatusPrompt"></div>
            </div>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'env-edit', with: envEditViewModel">
            <div class="input-group">
                <label for="env-edit-name" class="col-all label" data-bind="text: nameLabel"></label>
                <input id="env-edit-name" class="col-all input" required="true" data-bind="textInput: name.value, css: { 'invalid-field': !!name.isModified() && !name.isValid() }" />

                <label for="env-edit-arm" class="col-all label" data-bind="text: armEndpointLabel"></label>
                <input id="env-edit-arm" class="col-start-1 col-end-3 input" required="true" data-bind="textInput: armEndpoint.value, css: { 'invalid-field': !!armEndpoint.isModified() && !armEndpoint.isValid() }" />
                <button id="env-edit-check" class="col-1 input" data-bind="text: autofillButtonLabel, click: onAutofillButtonClick, enable: isAutofillEnabled"></button>

                <fieldset class="col-all">
                    <legend data-bind="text: additionalPropertiesLabel"></legend>

                    <div class="input-group group-box">
                        <label for="env-edit-arm-audience" class="col-all label" data-bind="text: armAudienceLabel"></label>
                        <input id="env-edit-arm-audience" class="col-all input" data-bind="textInput: displayArmAudienceEndpoints, css: { 'invalid-field': !!armAudienceEndpoints.isModified() && !armAudienceEndpoints.isValid() }" />

                        <label for="env-edit-ms-graph" class="col-all label" data-bind="text: msGraphEndpointLabel"></label>
                        <input id="env-edit-ms-graph" class="col-all input" data-bind="textInput: msGraphEndpoint.value, css: { 'invalid-field': !!msGraphEndpoint.isModified() && !msGraphEndpoint.isValid() }" />

                        <label for="env-edit-asm" class="col-all label" data-bind="text: asmEndpointLabel"></label>
                        <input id="env-edit-asm" class="col-all input" data-bind="textInput: asmEndpoint.value, css: { 'invalid-field': !!asmEndpoint.isModified() && !asmEndpoint.isValid() }" />
                    </div>
                </fieldset>

                <button class="link col-all input right-align" data-bind="text: armEndpointHelpLabel, click: onClickArmEndpointHelpLink"></button>
            </div>

            <div class="alert" data-bind="visible: isProcessing">
                <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                <div data-bind="text: statusMessage"></div>
            </div>
            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>

        <div id="panel-change-alert" class="visually-hidden" role="alert"></div>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

<script id="orientation-bar" type="text/html">
    <div class="orientation-bar" data-bind="foreach: $root.signposts">
        <!-- ko if: $index() > 0 -->
        <div class="chevron">
            <se-icon params="with: { name: 'ChevronRight' }"></se-icon>
        </div>
        <!-- /ko -->

        <div class="signpost" data-bind="
            attr: { 'aria-label': accessibleLabel },
            css: {
                'wizard-previous': $index() < $root.currentSignpost(),
                'wizard-current': $index() === $root.currentSignpost(),
                'wizard-future': $index() > $root.currentSignpost()
            }">
            <label data-bind="text: label"></label>
        </div>
    </div>
</script>

<script id="auth-select" type="text/html">
    <h2 data-bind="text: authSelectPrompt, attr: { 'aria-label': authSelectPrompt }"></h2>

    <div class="input-group" data-bind="foreach: authMethods">
        <input class="col-1 checkbox" type="radio" data-bind="
            checked: $parent.selectedAuthMethod,
            checkedValue: value,
            attr: { id: `${$parent.id}-${value}-input`, name: `${$parent.id}-options` }" />
        <label for="account-auth-key-input" class="col-2 label" data-bind="
            text: label,
            attr: { for: `${$parent.id}-${value}-input` }">
        </label>
    </div>
</script>

<script id="entry-panel" type="text/html">
    <div class="input-group">
        <label class="col-all label" data-bind="text: displayNameLabel, attr: { for: `${id}-display-name` }"></label>
        <input class="col-all input" data-bind="
            textInput: displayNameInput.value,
            attr: { id: `${id}-display-name` },
            css: { 'invalid-field': !!displayNameInput.isModified() && !displayNameInput.isValid() }" />

            <label class="col-all label" data-bind="text: entryLabel, attr: { for: `${id}-entry` }"></label>
            <textarea class="col-all input" required="true" rows="5" data-bind="
                textInput: entry.value,
                attr: { id: `${id}-entry` },
                css: { 'invalid-field': !!entry.isModified() && !entry.isValid() }">
            </textarea>
        </div>

    <se-alert params="with: validationAlert"></se-alert>
    <!-- ko foreach: validationWarnings -->
    <se-alert params="with: $data"></se-alert>
    <!-- /ko-->
</script>
</html>
