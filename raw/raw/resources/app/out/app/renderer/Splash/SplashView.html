<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <link href="./Splash.css" rel="stylesheet" />
</head>

<body>
    <div class="splash">
        <div class="spacer"></div>
        <div class="app-name">Microsoft Azure Storage Explorer</div>
        <img class="app-icon" src="../../media/StorageExplorerColor.svg" />
        <div class="app-load-indicator">
            <img src="../../media/Common/Halo_ProgressSpinner.svg" />
        </div>
        <div class="spacer"></div>
        <div class="footer">
            <span id="app-version"></span>
        </div>
    </div>
    <script>
        const version = new URLSearchParams(global.location.search).get("version");
        const el = document.getElementById("app-version");
        if (!!el && !!version) {
            el.textContent = `v${version}`;
        }
    </script>
</body>

</html>
