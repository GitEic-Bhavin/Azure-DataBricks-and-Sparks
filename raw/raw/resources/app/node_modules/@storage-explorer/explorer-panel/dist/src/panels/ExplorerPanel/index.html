<!DOCTYPE html>

<html class="page" lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self';
        font-src 'self'" />
    <link rel="stylesheet" type="text/css" href="./styles.css">
    <title>Explore Resources Panel</title>
</head>

<body>
    <div class="panel-header">
        <h1 data-bind="text: panelHeaderTitle"></h1>
    </div>

    <div class="content">
        <div class="tree-view" style="white-space: nowrap">
            <!-- ko template: { name: 'treeViewTemplate', data: treeViewModel } -->
            <!-- /ko -->
        </div>
        <!-- ko template: { name: 'footerTemplate', data: footerViewModel } -->
        <!-- /ko -->
    </div>
</body>

<script type="text/html" id="treeViewTemplate">
    <div id="not-tree">
        <!-- ko template: { name: 'searchTemplate', data: searchViewModel } -->
        <!-- /ko -->

        <!-- Invisible div that we use to send out aria alerts regarding the state of the resource tree -->
        <div aria-live="assertive" role="status" data-bind="attr:{ 'aria-label': treeViewAriaAlert }"></div>

        <div class="informative-container">
            <!-- ko if: !invalidPath() && isExecutingSearch() -->
            <div class="informative content" aria-live="polite" role="status">
                <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                <p tabindex="0" data-bind="text: searchProgressMessage"></p>
            </div>
            <!-- /ko -->
            <!-- ko if: !invalidPath() && isShowingSearchResults() && !isExecutingSearch() && !isScoping() -->
            <div class="informative content" aria-live="polite" role="status">
                <se-icon params="with: { name: 'StatusCompletedColor' }"></se-icon>
                <p tabindex="0" data-bind="text: searchProgressMessage"></p>
            </div>
            <!-- /ko -->
            <!-- ko if: invalidPath() -->
            <div class="informative content" aria-live="polite" role="status">
                <se-icon params="with: { name: 'StatusWarningColor' }"></se-icon>
                <p tabindex="0" data-bind="text: invalidPathText"></p>
            </div>
            <!-- /ko -->
        </div>

        <div class="tree-loading" data-bind="visible: isLoading">
            <se-progress-icon params="with: { themed: true }"></se-progress-icon>
        </div>

        <!-- ko if: !isEmpty() && !invalidPath() -->
        <!-- ko template: { name: 'actionLinksTemplate' } -->
        <!-- /ko -->
        <!-- /ko -->
    </div>
    <!-- Use styling/display:none to control visibility, as we don't want the nodes-container div to be re-rendered because we use it to help tree view resizing dependency. -->
    <div class="container" data-bind="style: { 'display': ((!isLoading() && !isLoadingSearchResults() && !isEmpty() && !invalidPath()) ? 'inherit' : 'none') }">
        <div class="nodes-container scrollable-content" tabindex="-1" data-bind="click: setFocus, attr: { 'aria-label': treeViewAriaLabel }, event: { keydown: onKeyDown }">
            <div role="main" class="main-div", data-bind="template: { name: 'nodeGroupTemplate', data: rootChildGroupViewModel }">
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="nodeGroupTemplate">
    <ul class="tree" data-bind="attr: { 'aria-label': ariaLabel, 'role': isRoot() ? 'tree' : 'group' }, visible: isExpanded, template: { name: 'nodeTemplate', foreach: children }"></ul>
</script>

<script type="text/html" id="nodeTemplate">
    <li role="treeitem" class="node" data-bind="
        attr: {
            'aria-selected': selected() ? 'true': 'false',
            'tabindex': selected() ? '0': '-1',
            'aria-label': displayName,
            'aria-expanded': canExpand() ? (isExpanded() ? 'true' : 'false') : null
        },
        css: { selected: selected() }">
        <div class="self" data-bind="
            attr: { 'aria-label': displayName, 'id': domId },
            style: { paddingLeft: paddingLeftPx },
            click: (vm, event) => vm.handleClick(event), event: { contextmenu: (vm, event) => vm.openContextMenu(false, event) }">
            <span class="node-expander" data-bind="click: (vm) => vm.toggle()">
                <div class="expander-icon" data-bind="visible: canExpand">
                    <se-icon params="with: { name: expanderIcon }"></se-icon>
                </div>
            </span>

            <!-- ko if: templateName === 'loadMoreItemTemplate'-->
            <span class="node-icon" data-bind="visible: isLoadingSiblings">
                <se-progress-ring params="with: { themed: true }"></se-progress-ring>
            </span>
            <!-- /ko -->
            <!-- ko if: templateName !== 'loadMoreItemTemplate' -->
            <span class="node-icon" data-bind="visible: !!icon()">
                <!-- ko if: isNamedIcon -->
                <se-icon params="with: { name: icon }"></se-icon>
                <!-- /ko -->
                <!-- ko ifnot: isNamedIcon -->
                <img data-bind="attr: { src: icon }" />
                <!-- /ko -->
            </span>
            <!-- /ko-->

            <div class="node-label">
                <!-- ko template: { name: templateName, data: $data } -->
                <!-- /ko -->
            </div>
        </div>

        <!-- ko template: { name: 'nodeGroupTemplate', data: childGroupViewModel } -->
        <!-- /ko -->
    </li>
</script>

<script type="text/html" id="defaultTreeItemTemplate">
    <span data-bind="attr: {'aria-label': displayName}, template: { name: 'displayNamePartTemplate', foreach: displayNameHighlightParts }, deselectOnDisposeBinding"></span>
    <span data-bind="attr: {'aria-label': displayStatus}, text: displayStatus"></span>
</script>

<!-- keep this as a single line, otherwise whitespace will appear between highlight parts -->
<script type="text/html" id="displayNamePartTemplate"><span data-bind="text: val, css: { highlight: highlight }"></span></script>

<script type="text/html" id="placeholderTemplate">
    <div class="placeholder">
        <input id="placeholderForInput" data-bind="
            textInput: newChildName,
            click: (vm, event) => vm.handleFocus(event),
            attr: {
                'aria-label': ariaLabel,
                'aria-invalid' : !isNameValid(),
                title: errorMessage
            },
            event: { blur: (vm, event) => vm.tryToCreateNewNode() }" />
        <div class="placeholder-icon" data-bind="visible: !isNameValid(), attr: { title: errorMessage }">
            <se-icon params="with: { name: 'StatusInvalidColor' }"></se-icon>
        </div>
    </div>
</script>

<script type="text/html" id="loadMoreItemTemplate">
    <div class="load-more">
        <span class="label" data-bind="visible: !isLoadingSiblings(), deselectOnDisposeBinding">
            <button tabindex="-1" data-bind="text: displayName, attr : {'aria-label': displayName}"></button>
        </span>

        <div data-bind="visible: isLoadingSiblings, attr: { 'aria-label': displayName }">
            <span class="label" data-bind="text: displayName"></span>
        </div>
    </div>
</script>

<script type="text/html" id="trailingActionItemTemplate">
    <div class="load-more">
        <span class="label">
            <button tabindex="-1" data-bind="text: displayName, attr : {'aria-label': displayName}"></button>
        </span>
    </div>
</script>

<script type="text/html" id="searchTemplate">
    <div id="search-area" class="search" data-bind="event: { focusout: onFocusout }">
        <div id="basic-search-panel">
            <button class="basic-search-button search-button" data-bind="
                click: (vm) => vm.startSearch(),
                attr: { 'aria-label': searchButtonAriaLabel }
            ">
                <se-icon params="with: { name: 'Search' }"></se-icon>
            </button>
            <input id="search-input" class="input" role="combobox" data-bind="
                textInput: searchValue,
                attr: { 'aria-label': searchViewAriaLabel, 'placeholder': searchPlaceholder},
                valueUpdate: ['input','keyup'],
                css: { 'searching': $parent.isExecutingSearch() },
                click: onClick,
                event: { 'keydown': (data, event) => onKeyDown(resourceFilterDropdown(), event) }
            "/>
            <button class="basic-search-button clear-button" data-bind="
                click: clearSearch,
                visible: $parent.isShowingSearchResults(),
                attr: {'aria-label': clearSearchAriaLabel },
            ">
                <se-icon params="with: { name: 'Cancel' }"></se-icon>
            </button>
            <button class="basic-search-button dropdown-button" data-bind="
                click: onDropdownClick,
                attr: { 'aria-label': toggleResourceFilterAriaLabel },
                css: { 'activated': !!resourceFilterDropdown() && resourceFilterDropdown().showingListBox() }
            ">
                <se-icon params="with: { name: 'Filter' }"></se-icon>
            </button>
        </div>
        <!-- ko if: !!resourceFilterDropdown() -->
            <!-- ko template: { name: 'multiselectListBoxTemplate', data: resourceFilterDropdown } -->
            <!-- /ko -->
        <!-- /ko -->
    </div>
</script>

<script type="text/html" id="actionLinksTemplate">
    <div class="action-links">
        <button class="label link" data-bind="text: collapseAllText, click: collapseAll"></button>
        <button class="label link" data-bind="text: refreshAllText, click: refreshAll"></button>
    </div>
</script>

<script type="text/html" id="multiselectListBoxTemplate">
    <div aria-live="polite" role="status" data-bind="attr: { 'aria-label': announcementMessage }"></div>
    <div class="multiselect-listBox" data-bind="visible: showingListBox, 'aria-expanded': showingListBox, event: { mousedown: onListBoxMouseDown }" >
        <label class="listBox-label" data-bind="text: listBoxLabel, attr: { id: listBoxId + '-label' }"></label>
        <ul class="listBox" role="listbox" data-bind="attr: { id: listBoxId, 'aria-labelledby': listBoxId + '-label' }">
        <!-- ko foreach: items -->
        <li class="listBox-option" role="option" data-bind="visible: enabled">
            <input class="option-checkbox" type="checkbox" data-bind="
                checked: checked,
                attr: { id: optionId },
                event: { keydown: (data, event) => $parent.onOptionKeyDown(data, event) }
            "/>
            <label class="option-label" data-bind="text: optionLabel, attr: { for: optionId }"></label>
        </li>
        <!-- /ko -->
        </ul>
    </div>
</script>

<script type="text/html" id="footerTemplate">
    <div class="footer">
        <div class="footer-content">
            <div class="divider horizontal"></div>

            <div class="tab-container">
                <div class="tab-list" role="tablist">
                    <!-- ko foreach: footerTabs -->
                    <button class="tab" role="tab" data-bind="
                        css: { active: active },
                        attr: { 'aria-label': displayName, 'aria-selected': active() ? 'true' : 'false' },
                        click: (vm) => $parent.selectFooterTab(vm)
                    ">
                        <div class="tab-button-content">
                            <div class="tab-area">
                                <div class="tab-active-indicator"></div>
                                <div class="tab-inner-area">
                                    <span class="tab-name" data-bind="attr: { title: displayName }, text: displayName"></span>
                                </div>
                            </div>
                            <div class="tab-right-border"></div>
                            <div class="tab-bottom-border"></div>
                        </div>
                    </button>
                    <!-- /ko -->
                </div>

                <div class="tab-spacer"></div>

                <div class="tab-panel-expander">
                    <button class="expander" data-bind="
                        click: toggle,
                        attr: { 'aria-label': toggleActionsPropertiesText, 'aria-expanded': isExpanded() ? 'true' : 'false' }
                        ">
                        <div class="expander-button-content">
                            <se-icon params="with: { name: toggleIcon }"></se-icon>
                        </div>
                    </button>
                </div>
            </div>

            <div class="tab-content">
                <!-- ko foreach: footerTabs -->
                <div data-bind="visible: active" class="scrollable-content">
                    <div data-bind="template: { name: templateName, data: $data }">
                    </div>
                </div>
                <!-- /ko -->
            </div>
        </div>
        <div class="drag-surface"></div>
    </div>
</script>

<script type="text/html" id="propertyDetailsTemplate">
    <div class="property-details">
        <!-- ko foreach: properties -->
        <!-- ko if: visible() -->
        <div class="property-name">
            <label data-bind="text: displayName, attr: { for: `property-label-${$index()}` }"></label>
        </div>
        <div class="property-show-button">
            <!-- ko if: isSecret -->
            <button class="toggle-secret-button" role="button" data-bind="
                click: toggleRevealValue,
                attr: { 'aria-label': secretToggleAriaLabel }">
                <se-icon params="with: { name: secretToggleImage }"></se-icon>
            </button>
            <!-- /ko -->
        </div>
        <div class="property-value">
            <input type="text" onclick="this.select();" readonly="readonly" data-bind="
                value: revealedDisplayValue,
                attr: { id: `property-label-${$index()}` }" />
        </div>
        <!-- /ko -->
        <!-- /ko -->
    </div>
</script>

<script type="text/html" id="actionDetailsTemplate">
    <div class="action-details">
        <div class="list">
            <!-- ko foreach: actions -->
            <button class="action-link link" data-bind="
                enable: enabled,
                attr: { 'aria-label': displayName() + (enabled() ? ', enabled' : ', disabled') },
                click: (vm) => vm.execute(),
                hasFocus: isFocused,
                css: { 'disabled': !enabled() }, style: { 'display': (visible() ? 'inherit' : 'none') }
            ">
                <div class="item">
                    <!-- ko if: isNamedIcon -->
                    <se-icon params="with: { name: icon }"></se-icon>
                    <!-- /ko -->
                    <!-- ko ifnot: isNamedIcon -->
                    <div class="icon">
                        <!-- ko if: !!iconAs -->
                        <span data-bind="icon: icon"></span>
                        <!-- /ko -->
                        <!-- ko if: !iconAs -->
                        <img data-bind="visible: !!icon, attr: { src: icon }" />
                        <!-- /ko -->
                    </div>
                    <!-- /ko -->
                    <span class="label" data-bind="text: displayName"></span>
                </div>
            </button>
            <!-- /ko -->
        </div>
    </div>
</script>

<script type="text/javascript" src="./index.js"></script>

</html>
