<!DOCTYPE html>

<html class="page" lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self';
        font-src 'self'" />
    <link rel="stylesheet" type="text/css" href="./styles.css">
    <title>Manage Accounts Panel</title>
</head>

<body>
    <div>
        <div class="panel-header">
            <h1 data-bind="text: panelHeaderTitle"></h1>
        </div>
        <div class="panel-body">
            <p class="prompt" data-bind="text: prompt"></p>
            <div class="accounts-list"  data-bind="template: { name: 'accountTemplate', foreach: accounts }"></div>
        </div>
        <div class="panel-footer">
            <div class="footer-add-account">
                <button class="link-button" data-bind="text: addAccountButtonLabel, click: addAccount"></button>
            </div>
            <div class="footer-buttons">
                <button data-bind="text: openExplorerPanelButtonLabel, click: openExplorerPanel"></button>
            </div>
        </div>
    </div>

    <script type="text/html" id="accountTemplate">
        <div class="account">
            <div class="display-info">
                <img class="account-image" data-bind="attr: { 'src': accountImage, 'aria-label': accountImageAriaLabel }">
                <div class="text-display-info">
                    <span class="display-name" data-bind="text: name"></span>
                    <span class="email" data-bind="text: email"></span>
                </div>
                <button class="link-button" data-bind="text: removeButtonLabel, click: remove, attr: { 'aria-description': removeButtonAriaDescription }"></button>
            </div>
            <!-- ko if: loadingTenants -->
            <div class="message-and-actions">
                <div class="message-with-image">
                    <se-icon class="spinner" params="with: { name: 'ProgressRingDotsColor' }"></se-icon>
                    <p data-bind="text: loadingMessage"></p>
                </div>
            </div>
            <!-- /ko -->
            <!-- ko ifnot: loadingTenants -->
            <!-- ko if: !tenantsLoadError() -->
            <div class="tenant-list"  data-bind="template: { name: 'tenantTemplate', foreach: tenants }"></div>
            <!-- /ko -->
            <!-- ko if: !!tenantsLoadError() -->
            <div class="message-and-actions">
                <div class="message-with-image">
                    <se-icon params="with: { name: 'StatusWarningColor' }"></se-icon>
                    <p data-bind="text: tenantsLoadErrorText"></p>
                </div>
                <div class="actions">
                    <button class="link-button" data-bind="text: errorDetailsButtonLabel, click: openErrorDetails"></button>
                    <button class="link-button" data-bind="text: reenterCredentialsButtonLabel, click: reenterCredentials"></button>
                </div>
            </div>
            <!-- /ko -->
            <!-- /ko -->
        </div>
    </script>

    <script type="text/html" id="tenantTemplate">
        <div class="tenant-and-subscriptions">
            <div class="tenant">
                <button class="expander" data-bind="click: expandOrCollapse, attr: { 'aria-label': expanderAriaLabel, 'aria-expanded': isExpanded() ? 'true' : 'false' }">
                    <se-icon params="with: { name: expanderIcon }"></se-icon>
                </button>
                <se-icon class="tenant-image" params="with: { name: 'AzureTenantColor' }"></se-icon>
                <div class="tenant-details" data-bind="click: expandOrCollapse">
                    <span class="tenant-name" data-bind="text: name"></span>
                    <span class="tenant-domain" data-bind="text: domain"></span>
                </div>
                <button class="tenant-menu-button" data-bind="click: openTenantConfigurationMenu, attr: { 'aria-label': configurationMenuAriaLabel }">
                    <se-icon params="with: { name: 'Settings' }"></se-icon>
                </button>
            </div>
            <div data-bind="visible: isExpanded">
                <!-- ko if: isActive -->
                <!-- ko if: loadingSubscriptions -->
                <div class="message-and-actions">
                    <div class="message-with-image">
                        <se-icon class="spinner" params="with: { name: 'ProgressRingDotsColor' }"></se-icon>
                        <p data-bind="text: loadingMessage"></p>
                    </div>
                </div>
                <!-- /ko -->
                <!-- ko ifnot: loadingSubscriptions -->
                <!-- ko if: !subscriptionsLoadError() -->
                <!-- ko if: !noSubscriptionsAvailable() -->
                <div class="subscription-list-and-check-all">
                    <div class="subscription-list-check-all">
                        <input type="checkbox" data-bind="checked: checked, enable: canToggleChecked, attr: { 'id': viewModelId + '-checkbox', 'aria-label': ariaLabel, 'aria-description': ariaDescription }">
                        <se-icon class="subscription-check-all-image" params="with: { name: 'AzureSubscriptionKeyColor' }"></se-icon>
                        <label data-bind="text: selectAllSubscriptionsLabel, attr: { 'for': viewModelId + '-checkbox' }"></label>
                    </div>
                    <div class="subscription-list" data-bind="foreach: subscriptions">
                        <div class="subscription">
                            <input type="checkbox" data-bind="checkedValue: $data, checked: $parent.selectedSubscriptions, attr: { 'id': viewModelId + '-checkbox', 'aria-label': ariaLabel, 'aria-description': ariaDescription }">
                            <div class="subscription-details">
                                <label data-bind="text: name, attr: { 'for': viewModelId + '-checkbox' }"></label>
                                <label class="subscription-id" data-bind="text: id, attr: { 'for': viewModelId + '-checkbox' }"></label>
                            </div>
                            <button class="hide-subscription-button" data-bind="click: (vm) => $parent.hideSubscriptionButtonClicked(vm), attr: { 'aria-label': hideButtonAriaLabel }">
                                <se-icon params="with: { name: 'EyeOff' }"></se-icon>
                            </button>
                        </div>
                    </div>
                </div>
                <!-- /ko -->
                <!-- ko if: noSubscriptionsAvailable() -->
                <div class="message-and-actions">
                    <div class="message-with-image">
                        <se-icon params="with: { name: 'StatusInfoColor' }"></se-icon>
                        <p data-bind="text: noSubscriptionsAvailableMessage"></p>
                    </div>
                    <div class="actions">
                        <button class="link-button" data-bind="text: attachAResourceLabel, click: attachAResource"></button>
                    </div>
                </div>
                <!-- /ko -->
                <!-- /ko -->
                <!-- ko if: !!subscriptionsLoadError() -->
                <div class="message-and-actions">
                    <div class="message-with-image">
                        <se-icon params="with: { name: 'StatusWarningColor' }"></se-icon>
                        <p data-bind="text: subscriptionsLoadErrorText"></p>
                    </div>
                    <div class="actions">
                        <button class="link-button" data-bind="text: errorDetailsButtonLabel, click: openErrorDetails"></button>
                        <button class="link-button" data-bind="text: reauthenticateNowButtonLabel, click: reauthenticate"></button>
                    </div>
                </div>
                <!-- /ko -->
                <!-- /ko -->
                <!-- /ko -->
                <!-- ko ifnot: isActive -->
                <div class="message-and-actions">
                    <div class="message-with-image">
                        <se-icon params="with: { name: 'StatusInfoColor' }"></se-icon>
                        <p data-bind="text: deactivatedMessage"></p>
                    </div>
                </div>
                <!-- /ko -->
            </div>
        </div>
    </script>
</body>

<script type=" text/javascript" src="./index.js"></script>

</html>
