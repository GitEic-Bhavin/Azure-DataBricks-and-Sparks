<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./ImportEntities.css" />
    <script type="text/javascript" src="../index.js"></script>
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: importEntitiesPanel">
            <div class="input-group">
                <label for="import-file" data-bind="text: importFileLabel"></label>
                <input id="import-file" readonly data-bind="value: importFile, click: browseFiles"/>
                <button data-bind="click: browseFiles, attr: { 'aria-label': importFileLabel }">...</button>
            </div>

            <div class="input-group">
                <!-- ko if: selectedFormat() === 'csv' -->
                <label for="delimiter" data-bind="text: delimiterLabel"></label>
                <input id="delimiter" data-bind="textInput: delimiter" />
                <!-- /ko -->
            </div>

            <div class="scroll-box">
                <table class="entity-table">
                    <thead>
                        <tr>
                            <th class="select-column"></th>
                            <th class="old-name-column"><div class="cell" data-bind="text: oldPropertyNameLabel"></div></th>
                            <th class="new-name-column"><div class="cell" data-bind="text: newPropertyNameLabel"></div></th>
                            <th class="type-column"><div class ="cell" data-bind="text: propertyTypeLabel"></div></th>
                            <th class="value-column"><div class="cell" data-bind="text: propertyValueLabel"></div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- ko foreach: propertyViewModels -->
                        <tr>
                            <td class="select-column">
                                <div class="cell">
                                    <input type="checkbox" data-bind="checked: isSelected" />
                                </div>
                            </td>
                            <td class="old-name-column">
                                <div class="cell">
                                    <input data-bind="value: oldName" readonly />
                                </div>
                            </td>
                            <td class="new-name-column">
                                <div class="cell">
                                    <input data-bind="
                                        textInput: newName,
                                        css: { 'invalid-field': !isNewNameValid() },
                                        attr: { title: newNameError }"
                                    />
                                </div>
                            </td>
                            <td class="type-column">
                                <div class="cell">
                                    <select data-bind="
                                        options: typeOptions,
                                        optionsText: 'label',
                                        value: type,
                                        enable: isTypeEditable
                                    "></select>
                                </div>
                            </td>
                            <td class="value-column">
                                <div class="cell">
                                    <input data-bind="value: value" readonly />
                                </div>
                            </td>
                        </tr>
                        <!-- /ko -->
                    </tbody>
                </table>

                <!-- ko if: isLoading -->
                <div class="loading-indicator">
                    <div class="overlay-contents">
                        <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                    </div>
                </div>
                <!-- /ko -->
            </div>

            <div class="options-group">
                <input type="checkbox" id="generate-option" data-bind="checked: autoGenerateKeys">
                <label for="generate-option" data-bind="text: autoGenerateKeysLabel"></label>

                <input type="checkbox" id="infer-option" data-bind="checked: inferTypes" />
                <label for="infer-option" data-bind="text: inferTypesLabel"></label>

                <input type="checkbox" id="empty-option" data-bind="checked: skipEmptyValues">
                <label for="empty-option" data-bind="text: skipEmptyValuesLabel"></label>

                <input type="checkbox" id="replace-option" data-bind="checked: replaceValues">
                <label for="replace-option" data-bind="text: replaceValuesLabel"></label>
            </div>

            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>
    </se-dialog-window>
</body>

</html>
