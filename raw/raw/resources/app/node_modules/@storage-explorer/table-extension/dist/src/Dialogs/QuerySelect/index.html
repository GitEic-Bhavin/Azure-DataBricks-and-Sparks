<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./QuerySelect.css" />
    <script type="text/javascript" src="../index.js"></script>
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="row">
                <label id="available-columns-label" data-bind="text: availableColumnsLabel"></label>
                <div class="column-options">
                    <div class="scroll-box">
                        <ul data-bind="foreach: columnOptions" aria-labelledby="available-columns-label" tabindex="0">
                            <li class="list-item" data-bind="
                                                        click: $parent.handleClick,
                                                        attr: { title: columnName, id: `${columnName}-list-item` }">
                                <input type="checkbox" data-bind="attr: { id: `${columnName}-input` }, checked: selected, enable: editable" />
                                <label data-bind="text: columnName, attr: { for: `${columnName}-input` }"></label>
                            </li>
                        </ul>
                    </div>
                    <div class="column-options-buttons">
                        <button data-bind="text: selectAllLabel, click: selectAll, disable: allColumnsSelected"></button>
                        <button data-bind="text: clearAllLabel, click: clearAll, enable: anyColumnsSelected"></button>
                    </div>
                </div>
            </div>

            <se-alert params="with: noColumnSelectedWarning"></se-alert>
        </se-dialog-panel>
    </se-dialog-window>
</body>

</html>
