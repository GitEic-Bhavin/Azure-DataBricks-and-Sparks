<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./ExportEntities.css" />
    <script type="text/javascript" src="../index.js"></script>
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="input-group">
                <label for="browse-files-input" data-bind="text: exportFileLabel"></label>
                <input id="browse-files-input" readonly="readonly" data-bind="value: exportFile, click: browseFiles" />
                <button data-bind="click: browseFiles, attr: { 'aria-label': exportFileLabel }">...</button>
            </div>

            <div class="input-group">
                <!-- ko if: selectedFormat() === 'json' -->
                <label for="indentation" data-bind="text: indentationLabel"></label>
                <input type="number" id="indentation" min="0" max="10" step="1" data-bind="value: indentationDisplayValue" />
                <!-- /ko -->
                <!-- ko if: selectedFormat() === 'csv' -->
                <label for="delimiter" data-bind="text: delimiterLabel"></label>
                <input id="delimiter" data-bind="textInput: delimiter" />
                <!-- /ko -->
            </div>

            <div class="input-group">
                <fieldset>
                    <legend data-bind="text: typeAnnotationsLabel"></legend>
                    <div class="check-group group-box">
                        <input type="radio" id="type-annotations-first-option" name="type-annotations" value="first" data-bind="checked: typeAnnotationsOption" />
                        <label for="type-annotations-first-option" data-bind="text: firstOptionLabel"></label>
                        <input type="radio" id="type-annotations-all-option" name="type-annotations" value="all" data-bind="checked: typeAnnotationsOption" />
                        <label for="type-annotations-all-option" data-bind="text: allOptionLabel"></label>
                        <input type="radio" id="type-annotations-none-option" name="type-annotations" value="none" data-bind="checked: typeAnnotationsOption" />
                        <label for="type-annotations-none-option" data-bind="text: noneOptionLabel"></label>
                    </div>
                </fieldset>
            </div>

            <div class="input-group">
                <input id="partition-keys-option" type="checkbox" data-bind="checked: includePartitionKeys" />
                <label for="partition-keys-option" data-bind="text: includePartitionKeysLabel"></label>

                <input id="row-keys-option" type="checkbox" data-bind="checked: includeRowKeys" />
                <label for="row-keys-option" data-bind="text: includeRowKeysLabel"></label>

                <input id="timestamps-option" type="checkbox" data-bind="checked: includeTimestamps" />
                <label for="timestamps-option" data-bind="text: includeTimestampsLabel"></label>
            </div>
        </se-dialog-panel>
    </se-dialog-window>
</body>

</html>
