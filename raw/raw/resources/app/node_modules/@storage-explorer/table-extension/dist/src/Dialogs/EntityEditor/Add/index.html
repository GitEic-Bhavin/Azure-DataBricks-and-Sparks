<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="../EntityEditor.css" />
    <script type="text/javascript" src="../../index.js"></script>
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="scroll-box">
                <table class="entity-table" role="application">
                    <thead>
                        <th class="property-column" data-bind="text: attributeNameLabel"></th>
                        <th class="type-column" data-bind="text: dataTypeLabel"></th>
                        <th class="value-column" data-bind="text: attributeValueLabel"></th>
                        <th class="action-column"></th>
                    </thead>
                    <tbody>
                        <!-- ko foreach: displayedAttributes -->
                        <tr>
                            <td class="property-column">
                                <input type="text" data-bind="
                                    textInput: name,
                                    attr: { 'aria-label': ariaNameLabel },
                                    css: { 'invalid-field': isNameInvalid },
                                    readOnly: !editable,
                                    hasFocus: nameHasFocus" />
                            </td>
                            <td class="type-column">
                                <select data-bind="
                                    options: $parent.edmTypes,
                                    value: type,
                                    enable: editable,
                                    readOnly: !editable,
                                    attr: { 'aria-label': ariaTypeLabel }">
                                </select>
                            </td>
                            <td class="value-column">
                                <input type="text" data-bind="
                                    textInput: value,
                                    attr: { placeholder: valuePlaceholder, 'aria-label': ariaValueLabel },
                                    css: { 'invalid-field' : isValueInvalid },
                                    readOnly: !valueEditable,
                                    hasFocus: valueHasFocus" />
                            </td>
                            <td class="action-column" data-bind="if: removable || editable">
                                <div class="action-button-container">
                                    <button type="button" class="inline-button" data-bind="
                                        click: () => $parent.editAttribute($data),
                                        attr: { 'aria-label': ariaEditButtonLabel, title: editButtonLabel }">
                                        <se-icon params="with: { name: 'Edit' }"></se-icon>
                                    </button>
                                    <button type="button" class="inline-button" data-bind="
                                        click: () => $parent.removeAttribute($index()),
                                        attr: { 'aria-label': ariaDeleteButtonLabel, title: removeButtonLabel }">
                                        <se-icon params="with: { name: 'Cancel' }"></se-icon>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <!-- /ko -->
                    </tbody>
                </table>
            </div>
            <div class="row entity-table">
                <div class="entity-table-row">
                    <div class="entity-table-cell">
                        <button type="button" class="inline-button" data-bind="text: addButtonLabel, enable: canAdd, click: insertAttribute"></button>
                    </div>
                </div>
            </div>
            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'editor-panel', with: editPanel">
            <div class="row">
                <label for="property-name" data-bind="text: nameLabel"></label>
                <input id="property-name" data-bind="value: name" readonly="readonly" />
            </div>
            <div class="row">
                <label for="property-type" data-bind="text: typeLabel"></label>
                <input id="property-type" data-bind="value: type" readonly="readonly" />
            </div>
            <div class="row">
                <label for="editor-area" data-bind="text: valueLabel"></label>
                <textarea id="editor-area" rows="6" data-bind="value: value"></textarea>
            </div>
        </se-dialog-panel>
    </se-dialog-window>
</body>

</html>
