<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./UploadBlobs.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: uploadBlobsViewModel">
            <legend data-bind="text: mainText, attr:{'aria-label': mainText}"></legend>
            <div class="row">
                <label for="caption" data-bind="text: filesOrFolderCaption"></label>
                <div class="input-with-button">
                    <input type="text" id="caption" readonly="readonly" data-bind="value: filesText, click: browseFiles" />
                    <input type="button" value="..." data-bind="click: browseFiles, attr: { 'aria-label': browseFilesLabel }" />
                </div>
                <se-alert params="with: selectedFilesOrFolderAlert"></se-alert>
            </div>
            <!-- ko if: showBlobTypePicker -->
            <div class="row">
                <label for="blobType" data-bind="text: blobTypeLabel"></label>
                <select id="blobType" data-bind="options: availableBlobTypes, optionsText: 'display', value: blobType"></select>
                <div class="indent">
                    <input id="uploadVhdAsPageBlob" type="checkbox" data-bind="enable: enableUploadAsPageOption, checked: uploadVhdAsPageBlob" />
                    <label for="uploadVhdAsPageBlob" data-bind="text: uploadAsPageLabel"></label>
                </div>
            </div>
            <div class="row">
                <label for="accessTier" data-bind="text: accessTierLabel"></label>
                <select id="accessTier" data-bind="enable: enableTierPicker, options: accessTiers, optionsText: 'display', value: accessTier"></select>
            </div>
            <!-- /ko -->
            <div class="row">
                <label for="uploadToDirectory" data-bind="text: destinationDirectoryLabel"></label>
                <input type="text" id="uploadToDirectory" data-bind="
                    value: destinationBlobFolder,
                    css: { 'invalid-field': !!invalidDestinationDirectoryError() }" />
                <se-alert params="with: destinationDirectoryAlertViewModel"></se-alert>
            </div>
            <div class="row">
                <label for="overwrite" data-bind="text: overwriteOptionLabel"></label>
                <select id="overwrite" data-bind="options: overwriteOptions, optionsText: 'display', value: overwriteOption"></select>
            </div>

            <!-- Section for setting initial tags -->
            <!-- ko if: showTagSection -->
            <div class="row stretch">
                <label id="tags-label" data-bind="text: tagsLabel"></label>
                <div class="scroll-box">
                    <table class="tab-table" role="application">
                        <thead>
                            <th class="name-column" data-bind="text: tagKeyLabel"></th>
                            <th class="value-column" data-bind="text: tagValueLabel"></th>
                            <th class="action-column"></th>
                        </thead>
                        <tbody>
                            <!-- ko foreach: tags -->
                            <tr>
                                <td class="name-column">
                                    <input class="tag-key" type="text" data-bind="
                                        value: key,
                                        attr: { placeholder: $parent.keyPlaceholder, 'aria-label': getKeyAriaLabel },
                                        css: { 'invalid-field': hasInvalidKey() }"
                                    />
                                </td>
                                <td class="value-column">
                                    <input class="tag-value" type="text" data-bind="
                                        value: value,
                                        attr: { placeholder: $parent.valuePlaceholder, 'aria-label': getValueAriaLabel },
                                        css: { 'invalid-field': hasInvalidValue() }"
                                    />
                                </td>
                                <td class="action-column">
                                    <div class="action-button-container">
                                        <button class="delete-button" data-bind="
                                            click: deleteSelf,
                                            disable: disableDelete,
                                            attr: { 'aria-label': getDeleteAriaLabel }
                                            ">
                                            <se-icon params="with: { name: 'Cancel' }"></se-icon>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <!-- /ko -->
                        </tbody>
                    </table>
                </div>
                <se-alert params="with: tagsErrorAlertViewModel"></se-alert>
            </div>
            <!-- /ko -->
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
