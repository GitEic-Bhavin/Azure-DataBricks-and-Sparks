<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./Retry.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: retryViewModel">
            <div class="main-container">
                <legend tabindex="0" data-bind="text: prompt, attr:{ 'aria-label': prompt }"></legend>
                <div class="scroll-box">
                    <table style="width:99.9%" role="grid">
                        <thead>
                            <tr>
                                <th class="cell">
                                    <label class="checkbox-and-label" for="selected">
                                        <input type="checkbox" id="selected" data-bind="visible: enableSelection, checked: selectAll" />
                                        <span data-bind="text: sourceLabel"></span> </label>
                                </th>
                                <th class="cell" data-bind="visible: showDestinationColumn, text: destinationLabel"></th>
                                <th class="cell" data-bind="text: failureReasonLabel"></th>
                            </tr>
                        </thead>
                        <tbody data-bind="foreach: transferOptions">
                            <tr data-bind="attr:{ 'aria-label': ariaLabel}" tabindex="0">
                                <td class="cell">
                                    <label class="checkbox-and-label indent" data-bind="attr: { 'for': id }">
                                        <input type="checkbox" data-bind="visible: $parent.enableSelection, checked: selected, attr: { 'id': id }" />
                                        <span data-bind="text: src"></span>
                                    </label>
                                </td>
                                <td class="cell" data-bind="visible: $parent.showDestinationColumn, click: $parent.selectTransfer, text: dst"></td>
                                <td class="cell" data-bind="click: $parent.selectTransfer, text: error"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="special-option-box" data-bind="visible: !!specialOptionLabel()">
                    <label for="specialOptionDropdown" data-bind="text: specialOptionLabel"></label>
                    <select id="specialOptionDropdown" class="special-option-dropdown" data-bind="options: specialOptionOptions, optionsText: 'displayValue', optionsValue: 'value', value: selectedSpecialOption">
                    </select>
                </div>
            </div>
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
