<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: addSettingViewModel">
            <div class="flex-container">
                <div id="setting-key">
                    <label class="label" for="key-input" data-bind="text: settingKeyLabel"></label>
                    <input id="key-input" class="text-input" type="text" data-bind="textInput: settingKeyInput, css: {
                            'invalid-field': isKeyMutated() && !isKeyValid()
                        }">
                </div>
                <div id="setting-value">
                    <label class="label" for="value-input" data-bind="text: settingValueLabel"></label>
                    <textarea id="value-input" class="textarea-input" data-bind="textInput: settingValueInput"></textarea>
                </div>
                <div id="setting-label">
                    <label class="label" for="label-input" data-bind="text: settingLabelLabel"></label>
                    <input id="label-input" class="text-input" type="text" data-bind="textInput: settingLabelInput">
                </div>
                <div id="setting-content-type">
                    <label class="label" for="content-type-input" data-bind="text: settingContentTypeLabel"></label>
                    <input id="content-type-input" class="text-input" type="text" data-bind="textInput: settingContentTypeInput">
                </div>
            </div>
            <se-alert params="with: alertViewModel"></se-alert>
        </se-dialog-panel>
    </se-dialog-window>
    <script type="text/javascript" src="./index.js"></script>
</body>

</html>
