<!DOCTYPE html>
<html class="page" lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="
            default-src 'self' 'unsafe-inline' 'unsafe-eval';
            img-src 'self' https: data:;
            child-src 'self';
            object-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval';
            style-src 'self' 'unsafe-inline';
            connect-src 'self' https:;
            font-src 'self' https:;" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />

    <title>App Config Explorer</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body class="container">
    <se-toolbar params="with: toolbarViewModel"></se-toolbar>
    <div class="filter-bar">
        <div class="filter">
            <label data-bind="text: keyFilterLabel, attr: { for: keyFilterId }"></label>
            <input type="text" data-bind="value: keyFilter, attr: { id: keyFilterId, placeholder: keyFilterPlaceholder }" />
        </div>
        <div class="filter">
            <label data-bind="text: labelFilterLabel, attr: { for: labelFilterId }"></label>
            <input type="text" data-bind="value: labelFilter, attr: { id: labelFilterId, placeholder: labelFilterPlaceholder }" />
        </div>
    </div>
    <se-datatable params="with: dataTableViewModel"></se-datatable>
    <script type="text/javascript" src="./index.js"></script>
</body>

</html>
