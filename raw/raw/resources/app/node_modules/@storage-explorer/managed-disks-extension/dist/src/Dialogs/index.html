<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />
</head>

<body>
    <script type="text/javascript">
        const dialogId = window.location.hash.substring(1);
        const dialogDirUrl = window.location.href.substring(0, window.location.href.lastIndexOf("/"));

        let newHref = window.location.href;
        switch (dialogId) {
            case "createSnapshot":
                newHref = `${dialogDirUrl}/CreateSnapshot/CreateSnapshotView.html#${dialogId}`;
                break;
            case "createDisk":
                newHref = `${dialogDirUrl}/CreateDisk/CreateDiskView.html#${dialogId}`;
                break;
            case "pasteDisk":
                newHref = `${dialogDirUrl}/PasteDisk/PasteDiskView.html#${dialogId}`;
                break;
        }
        window.location.href = newHref;
    </script>
</body>
