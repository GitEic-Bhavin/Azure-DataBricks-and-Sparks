<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./CreateSnapshot.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="content">
                <legend data-bind="text: mainText, attr:{'aria-label': mainText}"></legend>
                <div class="row">
                    <label for="snapshotNameInput" data-bind="text: snapshotNameInputLabel"></label>
                    <input type="text" id="snapshotNameInput" data-bind="textInput: snapshotNameValue, hasFocus: snapshotNameHasFocus, css: { 'invalid-field': !!errorMessage() }" />
                </div>
                <div class="row">
                    <label for="resourceGroupInput" data-bind="text: resourceGroupInputLabel"></label>
                    <select id="resourceGroupInput" data-bind="options: resourceGroupInputOptions, optionsText: 'displayText', value: selectedResourceGroup"></select>
                </div>
                <se-alert params="with: inputValidationAlertViewModel"></se-alert>
            </div>
        </se-dialog-panel>
    </se-dialog-window>
</body>

<script type="text/javascript" src="../index.js"></script>

</html>
