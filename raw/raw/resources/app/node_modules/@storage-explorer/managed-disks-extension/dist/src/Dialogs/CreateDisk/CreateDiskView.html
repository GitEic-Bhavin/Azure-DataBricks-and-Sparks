<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./CreateDisk.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panel">
            <div class="content">
                <legend data-bind="text: mainText, attr:{'aria-label': mainText}"></legend>
                <div class="row">
                    <label for="chooseFilesInput" data-bind="text: chooseFileInputLabel"></label>
                    <div class="input-with-button">
                        <input type="text" id="chooseFilesInput" readonly="readonly" data-bind="value: chooseFileInputValue, click: browseFiles" />
                        <input type="button" value="..." data-bind="click: browseFiles, attr: { 'aria-label': chooseFilesAriaLabel }" />
                    </div>
                </div>
                <div class="row">
                    <label for="diskNameInput" data-bind="text: diskNameInputLabel"></label>
                    <input type="text" id="diskNameInput" data-bind="textInput: diskNameValue, css: { 'invalid-field': !!errorMessage() }" />
                </div>
                <div class="row">
                    <label for="osTypeInput" data-bind="text: osTypeInputLabel"></label>
                    <select id="osTypeInput" data-bind="options: osTypeInputOptions, optionsText: 'displayText', value: selectedOsType"></select>
                </div>
                <div class="row">
                    <label for="locationInput" data-bind="text: locationInputLabel"></label>
                    <select id="locationInput" data-bind="foreach: locationInputOptionGroups, value: selectedLocation">
                        <optgroup data-bind="attr: { label: label }, foreach: children">
                            <option data-bind="text: displayText, option: $data"></option>
                        </optgroup>
                    </select>
                </div>
                <div class="row">
                    <label for="availabilityZoneInput" data-bind="text: availabilityZoneInputLabel"></label>
                    <select id="availabilityZoneInput" data-bind="options: availabilityZoneInputOptions, optionsText: 'displayText', value: selectedAvailabilityZone"></select>
                </div>
                <div class="row">
                    <label for="accountTypeInput" data-bind="text: accountTypeInputLabel"></label>
                    <select id="accountTypeInput" data-bind="options: accountTypeInputOptions, optionsText: 'displayText', value: selectedAccountType"></select>
                </div>
                <div class="row">
                    <label for="generationInput" data-bind="text: generationInputLabel"></label>
                    <select id="generationInput" data-bind="options: generationInputOptions, optionsText: 'displayText', value: selectedGeneration"></select>
                </div>
                <div class="row">
                    <label for="architectureInput" data-bind="text: architectureInputLabel"></label>
                    <select id="architectureInput" data-bind="options: architectureInputOptions, optionsText: 'displayText', value: selectedArchitecture"></select>
                </div>
                <se-alert params="with: inputValidationAlertViewModel"></se-alert>
            </div>
        </se-dialog-panel>
    </se-dialog-window>
</body>

<script type="text/javascript" src="../index.js"></script>

</html>
