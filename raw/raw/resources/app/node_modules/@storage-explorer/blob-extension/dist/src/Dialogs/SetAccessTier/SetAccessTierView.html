<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./SetAccessTier.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: setAccessTierViewModel">
            <div id="message" class="row" data-bind="text: message"></div>

            <!-- ko if: hasLearnMoreLink  -->
            <a id="learn-more" href="#" data-bind="text: learnMoreLinkName, click: openLearnMore"></a>
            <!-- /ko-->

            <div class="option-select" data-bind="foreach: options">
                <div class="option">
                    <input type="radio" name="optionGroup" data-bind="attr: { id: id }, checkedValue: value, checked: $parent.selectedOption" />
                    <label data-bind="attr: { for: id }"><span data-bind="text: title"> </span>
                    </label>
                </div>
            </div>
            <se-alert params="with: archiveAlertViewModel"></se-alert>

            <!-- ko if: showRehydratePriority-->
            <div class="rehydrate-priority">
                <label id="rehydratePriorityLabel" data-bind="text: rehydratePriorityLabel"></label>
                <select id="rehydrate-priority" data-bind="options: rehydratePriorities, optionsText: 'display', value: selectedRehydratePriority">
                </select>
                <div id="rehydrate-priority-confirmation" data-bind="visible: enableRehydratePriorityConfirmation, css: {'enableRehydratePriorityConfirmation': enableRehydratePriorityConfirmation}">
                    <input id="rehydrate-priority-confirmation-checkbox" type="checkbox" data-bind="checked: rehydratePriorityConfirmation">
                    <label for="rehydrate-priority-confirmation-checkbox" data-bind="text: rehydratePriorityConfirmationLabel"></label>
                </div>
                <se-alert params="with: rehydrateAlertViewModel"></se-alert>
            </div>
            <!-- /ko -->
        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>

</html>
