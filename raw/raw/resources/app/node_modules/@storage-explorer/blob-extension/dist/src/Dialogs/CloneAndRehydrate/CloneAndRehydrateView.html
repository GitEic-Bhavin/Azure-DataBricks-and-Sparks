<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />

    <link rel="stylesheet" href="./CloneAndRehydrate.css" />
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: cloneAndRehydrateViewModel">
            <div id="message" class="row" data-bind="text: message"></div>

            <div class="row">
                <label for="destination-container-name" data-bind="text: destinationContainerNameLabel"></label>
                <input id="destination-container-name" type="text" data-bind="
                    textInput: destinationContainerName,
                    css: { 'invalid-field': !destinationContainerNameValidationResult().isValid }" />
                <se-alert class="alert-container" params="with: destinationContainerNameAlertViewModel"></se-alert>
            </div>

            <div class="row">
                <label for="destination-blob-name" data-bind="text: destinationBlobNameLabel"></label>
                <input id="destination-blob-name" type="text" data-bind="
                    textInput: destinationBlobName,
                    css: { 'invalid-field': !destinationBlobNameValidationResult().isValid }" />
                <se-alert class="alert-container" params="with: destinationBlobNameAlertViewModel"></se-alert>
            </div>

            <div class="row">
                <label for="destination-blob-tier" data-bind="text: destinationBlobTierLabel"></label>
                <select id="destination-blob-tier" data-bind="options: blobTierOptions, optionsText: 'display', value: destinationBlobTier"></select>
                <a href="#" data-bind="text: accessTierLearnMoreLinkName, click: openLearnMore"></a>
            </div>

            <div class="row">
                <label for="rehydrate-priority" data-bind="text: rehydratePriorityLabel"></label>
                <select id="rehydrate-priority" data-bind="options: rehydratePriorityOptions, optionsText: 'display', value: rehydratePriority"></select>
                <div id="rehydrate-priority-confirmation" data-bind="visible: enableRehydratePriorityConfirmation, css: {'enableRehydratePriorityConfirmation': enableRehydratePriorityConfirmation}">
                    <input id="rehydrate-priority-confirmation-checkbox" type="checkbox" data-bind="checked: rehydratePriorityConfirmation">
                    <label for="rehydrate-priority-confirmation-checkbox" data-bind="text: rehydratePriorityConfirmationLabel"></label>
                </div>
                <se-alert class="alert-container" params="with: rehydrateAlertViewModel"></se-alert>
            </div>

        </se-dialog-panel>
    </se-dialog-window>

    <script type="text/javascript" src="../index.js"></script>
</body>
