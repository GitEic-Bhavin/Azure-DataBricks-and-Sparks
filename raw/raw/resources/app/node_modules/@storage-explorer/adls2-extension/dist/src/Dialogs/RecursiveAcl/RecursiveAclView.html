<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />
    <link rel="stylesheet" href="./RecursiveAcl.css" />
    <script type="text/javascript" src="../index.js"></script>
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: panelViewModel">
            <div class="row">
                <p class="prompt" data-bind="text: shortPrompt"></p>
            </div>
            <div class="row">
                <p data-bind="text: fullPrompt"></p>
            </div>
            <div class="row">
                <label for="handle-failure-behavior-select" data-bind="text: handleFailureBehaviorLabel"></label>
                <select id="handle-failure-behavior-select" data-bind="
                    options: failureBehaviorOptions,
                    optionsText: 'displayText',
                    value: selectedFailureBehaviorOption">
                </select>
            </div>
            </div>
            <div class="row">
                <a href="#" data-bind="text: learnMoreText, click: openLearnMoreLink"></a>
            </div>
            <div class="row">
                <div>
                    <input type="checkbox" id="user-understands-check" data-bind="checked: confirmationChecked">
                    <label for="user-understands-check" data-bind="text: confirmationText"></label>
                </div>
            </div>
        </se-dialog-panel>
    </se-dialog-window>
</body>
</html>
