<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=9" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        img-src 'self' https: data:;
        child-src 'self';
        object-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        connect-src 'self' https:;
        font-src 'self' https:;" />
    <title>Microsoft Azure Storage Explorer - Manage Access</title>

    <link rel="stylesheet" href="./ManagePosixAcl.css" />
    <script type="text/javascript" src="../index.js"></script>
</head>

<body>
    <se-dialog-window params="with: $data">
        <se-dialog-panel params="id: 'default-panel', with: viewEntitiesPanel">
            <div class="prompt">
                <p id="prompt" class="current-target" data-bind="text: prompt"></p>
            </div>

            <div class="main-container">
                <div class="permission-entity-picker-container">
                    <div role="listbox" id="permission-entity-list" class="permission-entity-list" aria-describedby="prompt">
                        <!-- ko foreach: permissionEntities -->
                        <div role="option" class="permission-entity" data-bind="
                                css: { 'selected': $parent.selectedEntity() === $data },
                                attr: { 'title': !!outOfSyncMessage() ? outOfSyncMessage() : undefined, 'tabindex': $parent.selectedEntity() === $data ? '0': '-1', 'aria-label': ariaLabel },
                                event: { keydown: (data, event) => $parent.onEntityKeyDown(data, event) },
                                hasFocus: focused,
                                click: (data, event) => { $parent.selectEntity(data); },
                                clickBubble: false">
                            <div class="permission-entity-main-row">
                                <div class="permission-entity-icon-identity">
                                    <!-- ko if: type === "group" -->
                                    <se-icon params="with: { name: 'Group' }"></se-icon>
                                    <!-- /ko -->
                                    <!-- ko if: type === "user" -->
                                    <se-icon params="with: { name: 'Contact' }"></se-icon>
                                    <!-- /ko -->
                                </div>
                                <div class="permission-entity-text-container">
                                    <div class="permission-entity-name" data-bind="html: displayNameWithStatus"></div>
                                    <!-- ko if: !!subText() -->
                                    <div class="permission-entity-sub-text" data-bind="text: subText"></div>
                                    <!-- /ko -->
                                </div>
                                <!-- ko if: outOfSync() -->
                                <div class="permission-entity-icon-info">
                                    <se-icon params="with: { name: 'StatusInfo' }"></se-icon>
                                </div>
                                <!-- /ko -->
                                <!-- ko if: canDelete -->
                                <div class="permission-entity-icon-garbage" data-bind="
                                        click: (data, event) => { $parent.deleteEntity(data, false); },
                                        clickBubble: false">
                                    <se-icon params="with: { name: 'Delete' }"></se-icon>
                                    </div>
                                <!-- /ko -->
                                <!-- ko if: canModify -->
                                <div class="permission-entity-icon-edit" data-bind="
                                        click: (data, event) => { $parent.modifyEntity(data, false); },
                                        clickBubble: false">
                                    <se-icon params="with: { name: 'Edit' }"></se-icon>
                                </div>
                                <!-- /ko -->
                            </div>
                        </div>
                        <!-- /ko -->
                    </div>
                </div>
                <div class="add-button-container">
                    <div class="max-info-and-learn-more">
                        <se-alert params="with: maxEntitiesReachedAlertViewModel"></se-alert>
                        <span><a href="" data-bind="text: promptLearnMoreLinkLabel, click: (data, event) => { openGeneralAclDocs(); }, onEnterKey: () => { openGeneralAclDocs(); }"></a></span>
                    </div>
                    <input class="add-button" type="button" data-bind="
                            click: onAddButtonClicked,
                            value: addButtonCaption,
                            visible: canAdd,
                            enable: maxEntitiesNotReached" />
                </div>
                <div class="permissions-matrix-container" id="permissions-matrix">
                    <label class="matrix-header permissions-for-header" for="permissions-matrix" data-bind="html: matrixLabel"></label>
                    <!-- ko foreach: permissions -->
                    <div class="matrix-header centered" data-bind="text: $data.displayName"></div>
                    <!-- /ko -->
                    <!-- ko foreach: scopes -->
                    <div class="scope-name-and-checkbox">
                        <input type="checkbox" data-bind="
                                checked: $parent.selectedEntity().getAcl($data.name).checked,
                                attr: { 'title': $parent.selectedEntity().getAcl($data.name).tooltip(), 'aria-label':  $data.displayName + ', ' + ($parent.selectedEntity().getAcl($data.name).checked() ? $parent.checkedDisplayString : $parent.disabledDisplayString) },
                                enable: $parent.selectedEntity().getAcl($data.name).canToggle
                            " />
                        <div class="scope-name" data-bind="text: $data.displayName"></div>
                    </div>
                    <!-- ko foreach: $parent.selectedEntity().getAcl($data.name).permissions -->
                    <div class="centered">
                        <input type="checkbox" data-bind="
                                checked: checked,
                                attr: { 'title': tooltip(), 'aria-label': permissionDisplayName + ', ' + $parent.displayName + ', ' + (checked() ? $parents[1].checkedDisplayString : $parents[1].disabledDisplayString) },
                                enable: canToggle() && $parents[1].selectedEntity().getAcl($parent.name).checked()
                            " />
                    </div>
                    <!-- /ko -->
                    <!-- /ko -->
                </div>
                <div class="help-alerts">
                    <se-alert params="with: outOfSyncWithMakHelperAlertViewModel">
                        <span><a href="" data-bind="text: linkMasksLearnMore, click: (data, event) => { openMaskDocs(); }, onEnterKey: () => { openMaskDocs(); }"></a></span>
                    </se-alert>
                    <se-alert params="with: permissionHelperAlertViewModel"></se-alert>
                </div>
                <div class="acl-notes-container" data-bind="style: { 'padding-top': isForDirectory ? '15px' : '0px' }">
                    <!-- ko if: isForDirectory -->
                    <span data-bind="text: defaultAclNote"></span>
                    <span><a href="" data-bind="
                            text: defaultAclDocLinkLabel,
                            click: (data, event) => { openDefaultAclDocs(); },
                            onEnterKey: () => { openDefaultAclDocs(); }"></a></span>
                    <!-- /ko -->
                </div>
            </div>
        </se-dialog-panel>

        <se-dialog-panel params="id: 'search-panel', with: searchEntitiesPanel">
            <div class="permission-entity-input-container">
                <label for="add-user-or-group-text-input" data-bind="text: formPrompt"></label>
                <div class="permission-entity-input-form">
                    <input type="text" id="add-user-or-group-text-input" data-bind="
                            enable: !searching(),
                            event: { keydown: (data, event) => onInputKeyDown(event) },
                            css: { 'invalid-border': errorMessage() !== '' },
                            textInput: searchInput,
                            attr: { 'placeholder': searchInputPlaceHolder },
                            hasFocus: searchInputFocused
                        " />
                    <div class="permission-entity-input-buttons">
                        <!-- ko if: !searching() -->
                        <input type="button" data-bind="click: search, enable: !searching(), value: searchButtonCaption" />
                        <!-- /ko -->
                        <!-- ko if: searching() -->
                        <button disabled="true">
                            <se-progress-ring params="with: { themed: true }"></se-progress-ring>
                        </button>
                        <!-- /ko -->
                    </div>
                </div>
                <se-alert params="with: inputValidationAlertViewModel"></se-alert>
            </div>
            <div class="permission-entity-picker-container">
                <div role="listbox" id="permission-entity-list" class="permission-entity-list">
                    <!-- ko foreach: searchResults -->
                    <div role="option" class="permission-entity" data-bind="
                        css: { 'selected': $parent.selectedSearchResult() === $data },
                        attr: { 'tabindex': $parent.selectedSearchResult() === $data ? '0': '-1', 'aria-label': ariaLabel },
                        event: { keydown: (data, event) => $parent.onSearchResultKeyDown(data, event) },
                        hasFocus: focused,
                        click: (data, event) => { $parent.selectedSearchResult(data); },
                        clickBubble: false">
                        <div class="permission-entity-main-row">
                            <div class="permission-entity-icon-identity">
                                <!-- ko if: entityType === "group" -->
                                <se-icon params="with: { name: 'Group' }"></se-icon>
                                <!-- /ko -->
                                <!-- ko if: entityType === "user" -->
                                <se-icon params="with: { name: 'Contact' }"></se-icon>
                                <!-- /ko -->
                            </div>
                            <div class="permission-entity-text-container">
                                <div class="permission-entity-name" data-bind="text: mainText"></div>
                                <!-- ko if: !!subText -->
                                <div class="permission-entity-sub-text" data-bind="text: subText"></div>
                                <!-- /ko -->
                            </div>
                        </div>
                    </div>
                    <!-- /ko -->
                </div>
            </div>
        </se-dialog-panel>
    </se-dialog-window>
</body>

</html>
